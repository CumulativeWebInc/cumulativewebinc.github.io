<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }

  body { display:flex; align-items:center; justify-content:center; font-family:monospace; color:#fff; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px; width:100%; max-width:860px; }
  #game { image-rendering:pixelated; image-rendering:crisp-edges; background:#0a0a12;

  #actions { display:flex; gap:10px; }
  .tbtn { user-select:none; -webkit-user-select:none; touch-action:none;
          background:#1a1a26; border:2px solid #17c3b2; color:#17c3b2; border-radius:12px;
          font-family:monospace; font-size:18px; font-weight:bold; text-align:center;
          display:flex; align-items:center; justify-content:center; cursor:pointer; min-height:44px; }
  .tbtn:active { background:#17c3b2; color:#0a0a12; }
  #dpad .tbtn { font-size:20px; }
  .abtn { width:84px; height:76px; font-size:15px; }
  #btn-punch { border-color:#ff6b8a; color:#ff6b8a; }
  #btn-punch:active { background:#ff6b8a; color:#0a0a12; }
  #btn-kick { border-color:#ffd23f; color:#ffd23f; }
  #btn-kick:active { background:#ffd23f; color:#0a0a12; }
  #btn-jump { border-color:#7b3fd4; color:#c9a9f5; }
  #btn-jump:active { background:#7b3fd4; color:#0a0a12; }
  #btn-pause { position:fixed; top:10px; right:10px; z-index:50; width:44px; height:44px;
          background:#1a1a26; border:2px solid #ffd23f; color:#ffd23f; border-radius:10px;
          font-size:18px; display:flex; align-items:center; justify-content:center; }
  #hint { font-size:10px; color:#666; text-align:center; line-height:1.5; user-select:none; -webkit-user-select:none; }
</style>

/* ===== logic.js (pure game core, zero DOM) ===== */
/* ============================================================
   STREET KINGS — pure game logic core (no DOM, no audio, no window)
   Original side-scrolling beat-'em-up. Clean-room genre mechanics:
   walk / punch / kick / jump / combos / weapons / waves / boss.
   IP-CLEAN: genre-inspired only. Original title, fighters, story, gangs,
   art, music, SFX — nothing borrowed from any existing game.
   Usable from node (tests) and browser (game) alike.
   ============================================================ */
var SK = (function () {
'use strict';

/* ---------------- utils ---------------- */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function sgn(v) { return v < 0 ? -1 : 1; }

/* ---------------- constants ---------------- */
var W = 384, H = 216;
var Y_MIN = 128, Y_MAX = 196;   // walkable depth band
var GRAV = 1500;                // jump gravity px/s^2
var JUMP_V = 520;               // jump velocity -> apex ~90px
var WALK = 110;                 // player px/s
var EXTRA_LIFE_AT = 15000;

var P_HP = 100;
var PUNCH = { dmg: 8,  range: 28, startup: 0.07, active: 0.13, recover: 0.16 };
var KICK  = { dmg: 12, range: 34, startup: 0.10, active: 0.14, recover: 0.22 };
var FIN   = { dmg: 16, range: 34, startup: 0.10, active: 0.14, recover: 0.26 }; // 3rd-hit finisher

var WEAPONS = {
  bat:    { dmg: 18, range: 42, uses: 3, label: 'BAT' },

};

    weapons: [],               // ground pickups {kind,x,y,uses}
    enemies: [],
    prevInput: {},
    player: null,
    shake: 0
  };
  resetPlayer(S, true);
  return S;
}

function resetPlayer(S, full) {
  S.player = {
    x: S.scrollX + 70, y: 165, z: 0, vz: 0,
    hp: P_HP, maxHp: P_HP,
    facing: 1, state: 'idle', stateT: 0,
    combo: 0, comboT: 0,
    weapon: null,              // {kind, uses}
    iframes: 0, walkPhase: 0,
    hitDone: false, downT: 0
  };
  if (full) { S.lives = 3; S.score = 0; S.extraLifeGiven = false; }
}

function startPlay(S) {
  S.screen = 'play';
  S.stageIdx = 0; S.scrollX = 0; S.waveIdx = 0; S.arena = null;
  S.enemies = []; S.weapons = []; S.particles = []; S.boss = null;
  S.score = 0; S.lives = 3; S.extraLifeGiven = false;
  resetPlayer(S, false);
  S.player.hp = P_HP;
  S.msg = 'STAGE 1 — NEON ROW'; S.msgT = 2.2;
  S.sfx.push('start');
}

/* ---------------- helpers ---------------- */
function curStage(S) { return S.stages[S.stageIdx]; }
function sfx(S, n) { if (S.sfx.length < 24) S.sfx.push(n); }
function addScore(S, n) {
  S.score += n;
  if (!S.extraLifeGiven && S.score >= EXTRA_LIFE_AT) {
    S.extraLifeGiven = true; S.lives++;
    S.msg = 'EXTRA LIFE!'; S.msgT = 2.0; sfx(S, 'extralife');
  }
}
function spark(S, x, y, z, color, n) {
  for (var i = 0; i < n; i++) {
    S.particles.push({
      x: x + (S.rng() - 0.5) * 10, y: y - 14 + (S.rng() - 0.5) * 14, z: z + S.rng() * 8,
      vx: (S.rng() - 0.5) * 160, vy: (S.rng() - 0.5) * 60, vz: S.rng() * 120,
      life: 0.35 + S.rng() * 0.2, t: 0, color: color, size: 2 + S.rng() * 2
    });
  }
}
function inRange(ax, ay, az, bx, by, bz, rx, ry, rz) {
  return Math.abs(ax - bx) < rx && Math.abs(ay - by) < ry && Math.abs(az - bz) < rz;
}

/* ---------------- enemies ---------------- */
function spawnEnemy(S, type, wx, wy) {
  var T = ETYPES[type];
  var e = {
    type: type, name: ENEMY_NAMES[type],
    x: wx, y: clamp(wy, Y_MIN, Y_MAX), z: 0, vz: 0,
    hp: T.hp, maxHp: T.hp, speed: T.speed, dmg: T.dmg, atkCdMax: T.cd,
    score: T.score, w: T.w, h: T.h,
    facing: -1, state: 'spawn', stateT: 0, atkCd: 0.4 + S.rng() * 0.8,
    hitDone: false, iframes: 0, walkPhase: S.rng() * 6, dead: false, deathT: 0,
    strafe: (S.rng() - 0.5) * 40
  };
  S.enemies.push(e);
  if (type === 'boss') { S.boss = e; S.msg = 'BIG CHROME'; S.msgT = 2.0; sfx(S, 'boss'); }
  return e;
}

function spawnWave(S, wave) {
  var cx = S.scrollX + W / 2;
  for (var i = 0; i < wave.comp.length; i++) {
    var side = (i % 2 === 0) ? 1 : -1;
    var wx = side > 0 ? S.scrollX + W + 24 + i * 26 : S.scrollX - 24 - i * 26;
    var wy = Y_MIN + 12 + S.rng() * (Y_MAX - Y_MIN - 24);
    spawnEnemy(S, wave.comp[i], wx, wy);
  }
  sfx(S, 'wave');
}

function hurtEnemy(S, e, dmg, dir, knockdown) {
  if (e.iframes > 0 || e.state === 'dead') return;
  e.hp -= dmg;
  e.facing = sgn(-dir) || 1;
  spark(S, e.x, e.y, e.z + 10, '#ffd23f', 5);
  if (e.hp <= 0) {
    e.hp = 0; e.state = 'dead'; e.deathT = 0; e.z = Math.max(e.z, 0);
    sfx(S, e.type === 'boss' ? 'bossko' : 'ko');
    spark(S, e.x, e.y, e.z + 10, '#ff5252', 10);
    addScore(S, e.score);
    // bruisers sometimes drop a bat
    if (e.type === 'bruiser' && S.rng() < 0.5) {
      S.weapons.push({ kind: 'bat', x: e.x, y: e.y, uses: WEAPONS.bat.uses });
    }
    if (e === S.boss) S.boss = null;
    return;
  }
  sfx(S, 'hit');
  if (knockdown || (e.type === 'punk' && dmg >= 14)) {
    e.state = 'down'; e.stateT = 0; e.vz = 160; // pop up, gravity slams down
  } else {
    e.state = 'hit'; e.stateT = 0;
  }
  e.x += dir * (knockdown ? 26 : 10);
}

function enemyStrike(S, e) {
  var p = S.player;
  if (p.iframes > 0 || p.state === 'down' || p.state === 'dead') return;
  var range = e.type === 'boss' ? 34 : 28;
  if (inRange(e.x, e.y, e.z, p.x, p.y, p.z, range, 12, 18)) {
    hurtPlayer(S, e.dmg, sgn(p.x - e.x) || 1, e.type === 'boss');
  }
}

function hurtPlayer(S, dmg, dir, heavy) {
  var p = S.player;
  if (p.iframes > 0 || p.state === 'down' || p.state === 'dead' || S.screen !== 'play') return;
  p.hp -= dmg;
  spark(S, p.x, p.y, p.z + 12, '#ff5252', 6);
  sfx(S, 'phit');
  S.shake = 0.18;
  if (p.weapon && (heavy || p.hp <= 0)) { // drop weapon on knockdown
    S.weapons.push({ kind: p.weapon.kind, x: p.x, y: clamp(p.y, Y_MIN, Y_MAX), uses: p.weapon.uses });
    p.weapon = null;
  }
  if (p.hp <= 0) {
    p.hp = 0;
    p.state = 'down'; p.stateT = 0; p.vz = 200; p.downT = 1.4; // long knockdown = death check at land
    sfx(S, 'pdown');
    return;
  }
  if (heavy) { p.state = 'down'; p.stateT = 0; p.vz = 170; p.downT = 0.9; sfx(S, 'pdown'); }
  else { p.state = 'hit'; p.stateT = 0; }
  p.x += dir * 12;
  p.iframes = 0.7;
}

function updateEnemy(S, e, dt) {
  var p = S.player;
  e.stateT += dt;
  if (e.iframes > 0) e.iframes -= dt;
  if (e.atkCd > 0) e.atkCd -= dt;

  // gravity for pop-up knockdowns
  if (e.z > 0 || e.vz !== 0) {
    e.vz -= GRAV * dt; e.z += e.vz * dt;
    if (e.z <= 0) { e.z = 0; e.vz = 0; }
  }

  switch (e.state) {
    case 'spawn':
      if (e.stateT > 0.45) { e.state = 'walk'; e.stateT = 0; }
      break;
    case 'walk': {
      if (p.state === 'dead' || S.screen !== 'play') break;
      var dx = p.x - e.x, dy = (p.y + e.strafe * 0.2) - e.y;
      e.facing = sgn(dx) || e.facing;
      var adx = Math.abs(dx), ady = Math.abs(dy);
      if (adx < 30 && ady < 11 && e.z === 0 && p.z < 18) {
        if (e.atkCd <= 0) { e.state = 'attack'; e.stateT = 0; e.hitDone = false; }
      } else {
        var sp = e.speed;
        if (adx > 24) e.x += sgn(dx) * sp * dt;
        if (ady > 7) e.y += sgn(dy) * sp * 0.72 * dt;
        e.walkPhase += dt * 10;
      }
      e.x = clamp(e.x, S.scrollX - 60, S.scrollX + W + 60);
      e.y = clamp(e.y, Y_MIN, Y_MAX);
      break;
    }
    case 'attack': {
      var T = ETYPES[e.type];
      var windup = e.type === 'boss' ? 0.4 : 0.32;
      e.facing = sgn(p.x - e.x) || e.facing;
      if (!e.hitDone && e.stateT >= windup) { e.hitDone = true; enemyStrike(S, e); sfx(S, 'eswing'); }
      if (e.stateT > windup + 0.25) { e.state = 'walk'; e.stateT = 0; e.atkCd = T.cd * (0.85 + S.rng() * 0.3); }
      break;
    }
    case 'hit':
      if (e.stateT > 0.28) { e.state = 'walk'; e.stateT = 0; }
      break;
    case 'down':
      if (e.z === 0 && e.stateT > 0.85) { e.state = 'getup'; e.stateT = 0; e.iframes = 0.8; }
      break;
    case 'getup':
      if (e.stateT > 0.4) { e.state = 'walk'; e.stateT = 0; }
      break;
    case 'dead':
      e.deathT += dt;
      break;
  }
}

/* ---------------- player combat ---------------- */
function playerAttackDef(p) {
  if (p.weapon) {
    var wd = WEAPONS[p.weapon.kind];
    return { dmg: wd.dmg, range: wd.range, startup: 0.08, active: 0.14, recover: 0.2, weapon: true };
  }
  if (p.state === 'jumpkick') return { dmg: JKICK.dmg, range: JKICK.range, weapon: false };
  if (p.combo === 3) return FIN;

function tryAttack(S, kind) {

    }
    return;
  }

  if (kind === 'punch' && !p.weapon) {
    for (var i = 0; i < S.weapons.length; i++) {
      var wp = S.weapons[i];
      if (Math.abs(wp.x - p.x) < 26 && Math.abs(wp.y - p.y) < 14) {
        p.weapon = { kind: wp.kind, uses: wp.uses };
        S.weapons.splice(i, 1);
        sfx(S, 'pickup'); spark(S, p.x, p.y, 20, '#41d8e8', 4);
        return;
      }
    }
  }
  if (p.comboT > 0 && kind === 'punch') p.combo = Math.min(p.combo + 1, 3);
  else { p.combo = (kind === 'kick') ? 0 : 1; }
  p.comboT = 0.9;
  p.state = (kind === 'kick') ? 'kick' : (p.combo === 3 ? 'fin' : 'punch');
  p.stateT = 0; p.hitDone = false;

  var best = null, bd = 1e9;
  for (var j = 0; j < S.enemies.length; j++) {
    var e = S.enemies[j];
    if (e.state === 'dead') continue;
    var d = Math.abs(e.x - p.x) + Math.abs(e.y - p.y);
    if (d < bd) { bd = d; best = e; }
  }
  if (best && bd < 90) p.facing = sgn(best.x - p.x) || p.facing;
  sfx(S, kind === 'kick' ? 'pswing' : 'pswing');
}

function applyPlayerHit(S) {
  var p = S.player;
  var def = playerAttackDef(p);
  var dir = p.facing;
  var hitAny = false;
  for (var i = 0; i < S.enemies.length; i++) {
    var e = S.enemies[i];
    if (e.state === 'dead' || e.state === 'spawn') continue;
    if (inRange(p.x + dir * def.range * 0.5, p.y, p.z + 8, e.x, e.y, e.z + 8,
                def.range * 0.5 + 12, 13, 20)) {
      var knockdown = (p.state === 'fin') || (p.state === 'kick' && e.type === 'punk');
      hurtEnemy(S, e, def.dmg, dir, knockdown);
      hitAny = true;
    }
  }
  if (hitAny) {
    if (p.weapon) {
      p.weapon.uses--;
      addScore(S, 25);
      if (p.weapon.uses <= 0) { p.weapon = null; sfx(S, 'break'); spark(S, p.x + dir * 20, p.y, 20, '#c9a227', 8); }
    }
  } else if (p.state !== 'jumpkick') {
    sfx(S, 'whiff');
  }
}

function updatePlayer(S, inp, dt) {
  var p = S.player;
  p.stateT += dt;
  if (p.iframes > 0) p.iframes -= dt;
  if (p.comboT > 0) { p.comboT -= dt; if (p.comboT <= 0) p.combo = 0; }

  // gravity
  if (p.z > 0 || p.vz !== 0) {
    p.vz -= GRAV * dt; p.z += p.vz * dt;
    if (p.z <= 0) {
      p.z = 0; p.vz = 0;
      if (p.state === 'jump' || p.state === 'jumpkick') { p.state = 'idle'; p.stateT = 0; }
    }
  }

  var st = curStage(S);
  var attacking = (p.state === 'punch' || p.state === 'kick' || p.state === 'fin' || p.state === 'jumpkick');

  switch (p.state) {
    case 'idle':
    case 'walk': {
      var mx = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      var my = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
      if (mx !== 0 || my !== 0) {
        p.state = 'walk';
        p.x += mx * WALK * dt;
        p.y += my * WALK * 0.72 * dt;
        p.walkPhase += dt * 11;
        if (mx !== 0) p.facing = mx;
      } else p.state = 'idle';
      p.x = clamp(p.x, S.scrollX + 14, S.scrollX + W - 14);
      p.y = clamp(p.y, Y_MIN, Y_MAX);
      // scroll follows when pushing right past 62%
      if (!S.arena && mx > 0 && p.x - S.scrollX > W * 0.62 && S.scrollX < st.scrollLen) {
        S.scrollX = Math.min(st.scrollLen, p.x - W * 0.62);
      }
      break;
    }
    case 'punch':
    case 'kick':
    case 'fin': {
      var def = playerAttackDef(p);
      if (!p.hitDone && p.stateT >= def.startup && p.stateT <= def.startup + def.active) {
        p.hitDone = true; applyPlayerHit(S);
      }
      if (p.stateT > def.startup + def.active + def.recover) { p.state = 'idle'; p.stateT = 0; }
      break;
    }
    case 'jump':
    case 'jumpkick': {
      var mx2 = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      p.x += mx2 * WALK * 0.9 * dt;
      p.x = clamp(p.x, S.scrollX + 14, S.scrollX + W - 14);
      if (p.state === 'jumpkick' && !p.hitDone) { p.hitDone = true; applyPlayerHit(S); }
      break;
    }
    case 'hit':
      if (p.stateT > 0.3) { p.state = 'idle'; p.stateT = 0; }
      break;
    case 'down':
      if (p.z === 0 && p.stateT > p.downT) {
        if (p.hp <= 0) { playerDie(S); }
        else { p.state = 'getup'; p.stateT = 0; p.iframes = 0.9; }
      }
      break;
    case 'getup':
      if (p.stateT > 0.4) { p.state = 'idle'; p.stateT = 0; }
      break;
    case 'dead':
      break;
  }

  // attack inputs (edges)
  if (inp.punch && !S.prevInput.punch) tryAttack(S, 'punch');
  if (inp.kick && !S.prevInput.kick) tryAttack(S, 'kick');
  if (inp.jump && !S.prevInput.jump && p.z === 0 &&
      (p.state === 'idle' || p.state === 'walk')) {
    p.state = 'jump'; p.stateT = 0; p.vz = JUMP_V; sfx(S, 'jump');
  }
}

function playerDie(S) {
  var p = S.player;
  S.lives--;
  sfx(S, 'pdead');
  spark(S, p.x, p.y, 20, '#ff5252', 14);
  if (S.lives < 0) {
    p.state = 'dead'; S.screen = 'gameover'; S.msg = ''; return;
  }
  // respawn: clear nearby enemies' aggression, full hp, brief safety
  p.hp = P_HP; p.state = 'idle'; p.stateT = 0; p.z = 0; p.vz = 0;
  p.weapon = null; p.iframes = 2.0; p.combo = 0; p.comboT = 0;
  p.x = S.scrollX + 70; p.y = 165;
  for (var i = 0; i < S.enemies.length; i++) S.enemies[i].atkCd = Math.max(S.enemies[i].atkCd, 1.2);
  S.msg = 'REY IS DOWN — ' + S.lives + (S.lives === 1 ? ' LIFE' : ' LIVES') + ' LEFT';
  S.msgT = 2.0;
}

/* ---------------- waves / stages ---------------- */
function updateWaves(S) {
  var st = curStage(S);
  if (S.arena) {
    // arena clears when no live enemies remain
    var live = false;
    for (var i = 0; i < S.enemies.length; i++)
      if (S.enemies[i].state !== 'dead') { live = true; break; }
    if (!live) {
      S.arena = null; S.waveIdx++;
      sfx(S, 'clear');
      if (S.waveIdx >= st.waves.length) stageClear(S);
      else { S.msg = 'WAVE DOWN'; S.msgT = 1.4; }
    }
    return;
  }
  if (S.waveIdx < st.waves.length) {
    var wv = st.waves[S.waveIdx];
    if (S.scrollX >= wv.x) { S.arena = wv; spawnWave(S, wv); }
  }
}

function stageClear(S) {
  if (S.stageIdx >= S.stages.length - 1) {
    S.screen = 'victory';
    addScore(S, 5000);
    sfx(S, 'victory');
    return;
  }
  S.stageIdx++;
  var st = curStage(S);
  S.scrollX = 0; S.waveIdx = 0; S.arena = null;
  S.enemies = []; S.weapons = []; S.boss = null;
  var p = S.player;
  p.x = 70; p.y = 165; p.z = 0; p.vz = 0; p.hp = P_HP;
  p.state = 'idle'; p.stateT = 0; p.weapon = null; p.iframes = 1.5;
  S.msg = 'STAGE ' + (S.stageIdx + 1) + ' — ' + st.name; S.msgT = 2.4;
  sfx(S, 'stageclear');
}

/* ---------------- main update ---------------- */
function update(S, inp, dt) {
  inp = inp || {};
  S.t += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.msgT > 0) { S.msgT -= dt; if (S.msgT <= 0) S.msg = ''; }

  // particles always animate
  for (var i = S.particles.length - 1; i >= 0; i--) {
    var q = S.particles[i];
    q.t += dt;
    if (q.t >= q.life) { S.particles.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
    q.vz -= 500 * dt; if (q.z < 0) { q.z = 0; q.vz = 0; }
  }

  if (S.screen === 'title') {
    if ((inp.start || inp.punch || inp.jump) && !S.prevInput.start && !S.prevInput.punch && !S.prevInput.jump)
      startPlay(S);
  } else if (S.screen === 'play') {
    if (!S.paused) {
      updatePlayer(S, inp, dt);
      for (var j = 0; j < S.enemies.length; j++) updateEnemy(S, S.enemies[j], dt);
      // sweep dead enemies

      updateWaves(S);
    }

    if (inp.start && !S.prevInput.start) {
      var keepSeed = S.seed;
      var keepScore = 0;
      var NS = newGame(keepSeed + 1);
      for (var f in NS) S[f] = NS[f];
      S.screen = 'title';
    }
  }

  S.prevInput = { punch: !!inp.punch, kick: !!inp.kick, jump: !!inp.jump, start: !!inp.start };
  return S;
}

/* ---------------- exports ---------------- */
function drainSfx(S) { var q = S.sfx; S.sfx = []; return q; }

return {
  W: W, H: H, Y_MIN: Y_MIN, Y_MAX: Y_MAX,
  P_HP: P_HP, EXTRA_LIFE_AT: EXTRA_LIFE_AT,

  newGame: newGame, update: update, startPlay: startPlay,

   big original set-piece, small framed cover-art wall signs only,
   gold-marquee crown title, portrait-box HUD, impact juice.

var cv = document.getElementById('game');
if (!cv) return;

/* ---------------- art (cover art for small framed signs / logo) ---------------- */
var ART = {};   // key -> HTMLImageElement
(function loadArt() {

    for (var k in SK_ART) {

/* ---------------- audio ---------------- */
var AC = null, masterGain = null, muted = false;
function audio() {
  if (AC) return AC;

    var Ctor = (window.AudioContext || window.webkitAudioContext);
    if (!Ctor) return null;
    AC = new Ctor();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.35;
    masterGain.connect(AC.destination);
  } catch (e) { AC = null; }

}
function tone(f0, f1, dur, type, vol, when) {

  g.gain.setValueAtTime(vol || 0.5, t);

function noise(dur, vol, freq, when) {

  var len = Math.floor(AC.sampleRate * dur);
  var buf = AC.createBuffer(1, len, AC.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  var src = AC.createBufferSource(); src.buffer = buf;
  var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
  var g = AC.createGain(); g.gain.setValueAtTime(vol || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);

}
function sfxPlay(n) {
  switch (n) {
    case 'pswing': case 'eswing': noise(0.08, 0.25, 2500); break;
    case 'jumpswing': noise(0.1, 0.3, 3000); tone(300, 600, 0.1, 'square', 0.2); break;
    case 'whiff': noise(0.06, 0.15, 4000); break;
    case 'hit': case 'phit': noise(0.09, 0.5, 900); tone(160, 70, 0.09, 'triangle', 0.5); break;
    case 'ko': tone(320, 50, 0.4, 'sawtooth', 0.5); noise(0.25, 0.4, 700); break;
    case 'pdown': tone(240, 45, 0.5, 'sawtooth', 0.5); noise(0.3, 0.4, 600); break;
    case 'pdead': tone(400, 40, 0.9, 'sawtooth', 0.5); break;
    case 'jump': tone(220, 520, 0.14, 'square', 0.25); break;
    case 'pickup': tone(660, 880, 0.09, 'square', 0.3); break;
    case 'break': noise(0.18, 0.5, 1800); break;
    case 'wave': tone(140, 140, 0.25, 'sawtooth', 0.35); tone(140, 140, 0.25, 'sawtooth', 0.35, 0.3); break;
    case 'clear': tone(523, 523, 0.12, 'square', 0.3); tone(659, 659, 0.12, 'square', 0.3, 0.12); tone(784, 784, 0.2, 'square', 0.3, 0.24); break;
    case 'stageclear': [523, 659, 784, 1047].forEach(function (f, i) { tone(f, f, 0.15, 'square', 0.3, i * 0.13); }); break;
    case 'victory': [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, f, 0.2, 'square', 0.3, i * 0.15); }); break;
    case 'boss': tone(98, 98, 0.4, 'sawtooth', 0.5); tone(98, 98, 0.4, 'sawtooth', 0.5, 0.45); break;
    case 'bossko': tone(200, 30, 0.8, 'sawtooth', 0.55); noise(0.5, 0.5, 500); break;
    case 'start': [392, 523, 659].forEach(function (f, i) { tone(f, f, 0.12, 'square', 0.3, i * 0.1); }); break;
    case 'extralife': [784, 988, 1175, 1568].forEach(function (f, i) { tone(f, f, 0.12, 'square', 0.3, i * 0.09); }); break;

/* ---------------- input ---------------- */
var input = { left: false, right: false, up: false, down: false, punch: false, kick: false, jump: false, start: false };
var tapStart = false; // canvas tap -> start (title/gameover/victory)

var KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  KeyJ: 'punch', KeyZ: 'punch',
  KeyK: 'kick', KeyX: 'kick',
  KeyL: 'jump', KeyC: 'jump', Space: 'jump',
  Enter: 'start'
};
function onKey(e, down) {
  var k = KEYMAP[e.code];
  if (k) { input[k] = down; if (e.cancelable) e.preventDefault(); audio(); }
  else if (e.code === 'KeyP' && down) { togglePause(); }
  else if (e.code === 'KeyM' && down) { muted = !muted; }
}
if (typeof window.addEventListener !== 'undefined') {
  window.addEventListener('keydown', function (e) { onKey(e, true); });
  window.addEventListener('keyup', function (e) { onKey(e, false); });
}

function bindHold(id, name) {
  var el = document.getElementById(id);
  if (!el) return;
  var on = function (e) { if (e.cancelable) e.preventDefault(); input[name] = true; audio(); };
  var off = function (e) { if (e.cancelable) e.preventDefault(); input[name] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
bindHold('btn-left', 'left'); bindHold('btn-right', 'right');
bindHold('btn-up', 'up'); bindHold('btn-down', 'down');
bindHold('btn-punch', 'punch'); bindHold('btn-kick', 'kick'); bindHold('btn-jump', 'jump');

var pauseBtn = document.getElementById('btn-pause');
if (pauseBtn) pauseBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); togglePause(); audio(); });
function togglePause() {
  if (S.screen === 'play') { S.paused = !S.paused; sfxPlay('pickup'); }
}
if (cv.addEventListener) {
  cv.addEventListener('pointerdown', function (e) {
    if (e.cancelable) e.preventDefault();
    audio();
    if (S.screen !== 'play') tapStart = true;
  });
}

/* ---------------- game state ---------------- */
var S = SK.newGame(20260927);
var acc = 0, lastT = 0;
var STEP = 1 / 60;
var hitstop = 0;            // KO hit-stop freeze (render layer only)
var stageClock = 99;        // cosmetic arcade stage timer
var lastStageIdx = -1;
var vdust = [];             // render-side dust puffs {x,y,vx,vy,t,life}

function frame(tms) {
  var t = tms / 1000;
  if (!lastT) lastT = t;
  var dt = Math.min(t - lastT, 0.1);
  lastT = t;
  if (hitstop > 0) { hitstop -= dt; updateDust(dt); render(); queueFrame(); return; }
  acc += dt;
  var n = 0;
  while (acc >= STEP && n < 5) {
    var snap = {
      left: input.left, right: input.right, up: input.up, down: input.down,
      punch: input.punch, kick: input.kick, jump: input.jump,
      start: input.start || tapStart
    };
    SK.update(S, snap, STEP);
    var q = SK.drainSfx(S);
    for (var i = 0; i < q.length; i++) {
      sfxPlay(q[i]);
      if (q[i] === 'ko') { hitstop = Math.max(hitstop, 0.1); S.shake = Math.max(S.shake, 0.22); }
      if (q[i] === 'bossko') { hitstop = Math.max(hitstop, 0.2); S.shake = Math.max(S.shake, 0.3); }
      if (q[i] === 'pdead') { hitstop = Math.max(hitstop, 0.25); }
      if (q[i] === 'pdown') { S.shake = Math.max(S.shake, 0.2); }
    }
    tapStart = false;
    acc -= STEP; n++;
  }
  if (n === 5) acc = 0;
  if (S.stageIdx !== lastStageIdx) { lastStageIdx = S.stageIdx; stageClock = 99; }
  if (S.screen === 'play' && !S.paused) stageClock = Math.max(0, stageClock - dt);
  updateDust(dt);
  render();
  queueFrame();
}
function queueFrame() {
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
}
function updateDust(dt) {
  for (var i = vdust.length - 1; i >= 0; i--) {
    var d = vdust[i];
    d.t += dt;
    if (d.t >= d.life) { vdust.splice(i, 1); continue; }
    d.x += d.vx * dt; d.y += d.vy * dt; d.vy -= 30 * dt;
  }
  if (vdust.length > 48) vdust.splice(0, vdust.length - 48);
}
function puffDust(x, y, n, spread) {
  for (var i = 0; i < n; i++) {
    vdust.push({
      x: x + (Math.random() - 0.5) * 14, y: y - Math.random() * 4,
      vx: (Math.random() - 0.5) * (spread || 60), vy: -20 - Math.random() * 30,
      t: 0, life: 0.4 + Math.random() * 0.25
    });
  }
}

/* ---------------- drawing helpers ---------------- */
function rr(x, y, w, h, r) { // rounded rect path
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, size, color, align) {
  ctx.font = 'bold ' + size + 'px monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = color || '#fff';
  ctx.fillText(s, x, y);
}
function goldTxt(s, x, y, size, align) { // arcade gold marquee lettering
  ctx.font = 'bold ' + size + 'px monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#3a2a08';
  var o = Math.max(1, Math.round(size / 14));
  ctx.fillText(s, x - o, y); ctx.fillText(s, x + o, y);
  ctx.fillText(s, x, y - o); ctx.fillText(s, x, y + o);
  ctx.fillStyle = '#c9a227';
  ctx.fillText(s, x, y - o);
  ctx.fillStyle = '#ffe9a3';
  ctx.fillText(s, x, y - o - 1);
}
function drawCrown(c, x, y, w, h, gold, jewel) { // original crown motif (CWI king theme)
  c.fillStyle = gold || '#c9a227';
  c.beginPath();
  c.moveTo(x, y + h);
  c.lineTo(x, y + h * 0.35);
  c.lineTo(x + w * 0.18, y + h * 0.62);
  c.lineTo(x + w * 0.32, y + h * 0.08);
  c.lineTo(x + w * 0.5, y + h * 0.55);
  c.lineTo(x + w * 0.68, y + h * 0.08);
  c.lineTo(x + w * 0.82, y + h * 0.62);
  c.lineTo(x + w, y + h * 0.35);
  c.lineTo(x + w, y + h);
  c.closePath();
  c.fill();
  c.fillStyle = '#7a5f14';
  c.fillRect(x, y + h * 0.78, w, h * 0.22);
  c.fillStyle = jewel || '#d83636';
  c.fillRect(x + w * 0.44, y + h * 0.42, w * 0.12, h * 0.12);
}

/* ============================================================
   SPRITE SYSTEM — original chunky-pixel fighters, pre-rendered to
   offscreen canvases at boot (iPhone 60fps: per-frame work is a
   handful of drawImage calls, zero per-frame allocation).
   Skeleton: parametric two-segment arms/legs, torso with lean,
   head with per-fighter original headgear. Facing is always +x in
   the sprite; drawFighter mirrors with ctx.scale(facing,1).
   ============================================================ */
var SPRITE_COUNT = 0;
function makeSprite(w, h) {
  var c = document.createElement('canvas');
  c.width = Math.ceil(w); c.height = Math.ceil(h);
  SPRITE_COUNT++;
  return c;
}

/* Fighter palettes — original designs. [jacket, jacketShade, pants,
   pantsShade, skin, hair, boot, glove] */
var PALS = {
  player: { jacket: '#17c3b2', jshade: '#0d7a70', pants: '#232f42', pshade: '#141b28',
            skin: '#e8b88a', hair: '#14141c', boot: '#3a2c1c', glove: '#0f5f59' },
  punk:   { jacket: '#d83636', jshade: '#8f1f1f', pants: '#3a3a44', pshade: '#22222a',
            skin: '#e8b88a', hair: '#d83636', boot: '#1c1c22', glove: '#e8b88a' },
  bruiser:{ jacket: '#7b3fd4', jshade: '#47208c', pants: '#1d1d26', pshade: '#101016',
            skin: '#d19a6b', hair: '#7b3fd4', boot: '#241a10', glove: '#2a1a3e' },
  boss:   { jacket: '#c9a227', jshade: '#77590f', pants: '#2c2416', pshade: '#171208',
            skin: '#e8b88a', hair: '#888888', boot: '#191410', glove: '#6e5212' }
};
var FSCALE = { player: 1.0, punk: 0.96, bruiser: 1.16, boss: 1.44 };
var TORSO_W = { player: 17, punk: 15, bruiser: 21, boss: 26 };

function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
/* limb segment: rect of width w from (x,y) at deg (0=+x, 90=down), returns end point */
function seg(c, x, y, deg, len, w, col) {
  var r = deg * Math.PI / 180;
  c.save();
  c.translate(x, y);
  c.rotate(r);
  c.fillStyle = col;
  c.fillRect(0, -w / 2, len, w);
  c.restore();
  return [x + Math.cos(r) * len, y + Math.sin(r) * len];
}

/* pose params: hip dy, torso lean deg, head dx/dy, armF/armB [shoulder,elbow],
   legF/legB [hip,knee]. Angles: 0=+x(forward), 90=down, -90=up. */
function poseParams(pose, type) {
  var P = {
    hip: 0, lean: 4, head: [1, 0],
    aF: [-30, 75], aB: [25, 85], lF: [10, 8], lB: [-12, 10]
  };
  switch (pose) {
    case 'idle1': P.hip = -1; P.aF = [-24, 70]; break;
    case 'walk0': P.hip = -1; P.lF = [28, 10]; P.lB = [-24, 14]; P.aF = [20, 60]; P.aB = [-18, 70]; break;
    case 'walk1': P.hip = -2; P.lF = [8, 42]; P.lB = [-6, 8]; P.aF = [26, 55]; P.aB = [-24, 65]; break;
    case 'walk2': P.hip = -1; P.lF = [-24, 14]; P.lB = [28, 10]; P.aF = [-18, 70]; P.aB = [20, 60]; break;
    case 'walk3': P.hip = -2; P.lF = [-6, 8]; P.lB = [8, 42]; P.aF = [-24, 65]; P.aB = [26, 55]; break;
    case 'punch_windup': P.lean = 6; P.aF = [45, 100]; P.aB = [20, 90]; break;
    case 'punch_jab': P.lean = 12; P.head = [3, 0]; P.aF = [2, 8]; P.aB = [30, 95]; P.lF = [14, 6]; break;
    case 'punch_cross': P.lean = 16; P.head = [4, 0]; P.aB = [-2, 8]; P.aF = [50, 100]; P.lB = [-18, 8]; break;
    case 'punch_uppercut': P.lean = 8; P.hip = 4; P.aF = [55, 25]; P.aB = [40, 90]; P.lF = [16, 20]; break;
    case 'punch_recover': P.lean = 6; P.aF = [28, 80]; break;
    case 'kick_chamber': P.lean = -4; P.lF = [-55, 85]; P.lB = [4, 4]; P.aF = [40, 60]; P.aB = [-30, 60]; break;
    case 'kick_extended': P.lean = -14; P.head = [-2, 0]; P.lF = [5, 6]; P.lB = [2, 2];
      P.aF = [55, 40]; P.aB = [-45, 40]; break;
    case 'jump': P.hip = -2; P.lF = [-30, 95]; P.lB = [20, 100]; P.aF = [-50, 40]; P.aB = [50, 40]; break;
    case 'jumpkick': P.lean = 22; P.head = [4, 0]; P.lF = [0, 4]; P.lB = [35, 70];
      P.aF = [60, 40]; P.aB = [-50, 50]; break;
    case 'hit': P.lean = -20; P.hip = 2; P.head = [-5, -1]; P.aF = [-60, 30]; P.aB = [60, 30];
      P.lF = [16, 12]; P.lB = [-8, 10]; break;
    case 'getup': P.lean = 30; P.hip = 9; P.aF = [70, 30]; P.aB = [80, 30]; P.lF = [40, 70]; P.lB = [-20, 70]; break;
    case 'swing': P.lean = 18; P.head = [2, 0]; P.aF = [-120, 20]; P.aB = [-100, 30];
      P.lF = [18, 10]; P.lB = [-14, 10]; break;
    case 'victory': P.lean = 2; P.hip = -2; P.head = [0, -2]; P.aF = [-150, 10]; P.aB = [30, 70];
      P.lF = [8, 6]; P.lB = [-8, 6]; break;
  }
  return P;
}

function drawHeadgear(c, type, hx, hy, hw, hh, pal, s) {
  if (type === 'player') {           // teal headband + knot tails
    R(c, hx - 1, hy + 2, hw + 2, 3 * s, '#17c3b2');
    R(c, hx - 5 * s, hy + 4, 4 * s, 2 * s, '#0d7a70');
    R(c, hx - 1, hy - 2, hw + 2, 3 * s, pal.hair);
  } else if (type === 'punk') {      // red mohawk fin
    R(c, hx + 2, hy - 7 * s, 4 * s, 7 * s, pal.hair);
    R(c, hx + 6, hy - 5 * s, 3 * s, 5 * s, '#8f1f1f');
    R(c, hx - 2, hy - 5 * s, 3 * s, 5 * s, '#8f1f1f');
  } else if (type === 'bruiser') {   // purple bandana + knot
    R(c, hx - 1, hy + 1, hw + 2, 4 * s, '#7b3fd4');
    R(c, hx + hw - 1, hy + 3, 5 * s, 3 * s, '#47208c');
  } else {                            // boss: chrome dome shine + heavy brow
    R(c, hx + 2, hy, 5 * s, 2 * s, '#f4f4f4');
    R(c, hx + hw - 5 * s, hy + 5 * s, 5 * s, 2 * s, '#5a4a1a');
  }
  // eyes (face +x) + mouth
  R(c, hx + hw - 5 * s, hy + 6 * s, 2 * s, 2 * s, '#101018');
  R(c, hx + hw - 8 * s, hy + 6 * s, 2 * s, 2 * s, '#101018');
  R(c, hx + hw - 7 * s, hy + 10 * s, 4 * s, 1.5 * s, '#7a4a32');
}

function drawFighterArt(c, type, pose, cw, ch) {
  var pal = PALS[type], s = FSCALE[type];
  var cx = cw / 2, feet = ch - 3 * s;
  var P = poseParams(pose, type);
  var torsoW = TORSO_W[type] * s, armW = 7 * s, legW = 8 * s;

  if (pose === 'down') { // knocked flat — sprawled body
    var gy = feet - 5 * s;
    R(c, cx - 24 * s, gy - 4 * s, 34 * s, 9 * s, pal.pants);            // legs
    R(c, cx - 24 * s, gy - 4 * s, 8 * s, 9 * s, pal.boot);
    R(c, cx + 10 * s, gy - 6 * s, 18 * s, 12 * s, pal.jacket);         // torso
    R(c, cx + 10 * s, gy - 6 * s, 18 * s, 4 * s, pal.jshade);
    R(c, cx + 28 * s, gy - 8 * s, 11 * s, 11 * s, pal.skin);           // head
    drawHeadgear(c, type, cx + 28 * s, gy - 8 * s, 11 * s, 11 * s, pal, s);
    seg(c, cx + 12 * s, gy, 150, 12 * s, armW, pal.jacket);            // sprawled arm
    seg(c, cx + 8 * s, gy - 2 * s, 200, 10 * s, armW * 0.9, pal.jshade);
    return;
  }

  var hipX = cx, hipY = feet - 25 * s + P.hip * s;
  var lean = P.lean * Math.PI / 180;
  var shX = hipX + Math.sin(lean) * 20 * s, shY = hipY - Math.cos(lean) * 20 * s;
  var tAng = -90 + P.lean;

  // back arm (behind torso)
  var shB = [shX - 3 * s, shY + 1 * s];
  var elB = seg(c, shB[0], shB[1], P.aB[0], 10 * s, armW, pal.jshade);
  var fiB = seg(c, elB[0], elB[1], P.aB[1], 9 * s, armW * 0.9, pal.skin);
  R(c, fiB[0] - 3 * s, fiB[1] - 3 * s, 6 * s, 6 * s, pal.glove);

  // back leg
  var hipB = [hipX - 2.5 * s, hipY];
  var knB = seg(c, hipB[0], hipB[1], P.lB[0], 12 * s, legW, pal.pshade);
  var anB = seg(c, knB[0], knB[1], P.lB[1], 12 * s, legW * 0.85, pal.pshade);
  R(c, anB[0] - 1 * s, anB[1] - 2 * s, 8 * s, 5 * s, pal.boot);

  // torso: shade back half + base front half
  var px = Math.cos(lean), py = Math.sin(lean);
  seg(c, hipX - px * 2.5 * s, hipY - py * 2.5 * s, tAng, 20 * s, torsoW * 0.55, pal.jshade);
  seg(c, hipX + px * 2 * s, hipY + py * 2 * s, tAng, 20 * s, torsoW * 0.62, pal.jacket);

  if (type === 'player') { // jacket zipper + collar
    var z1 = seg(c, shX + 2 * s, shY + 2 * s, tAng, 16 * s, 2 * s, '#e8f6f4');
    R(c, shX - 5 * s, shY - 1 * s, 10 * s, 3 * s, pal.jshade);
  } else if (type === 'punk') { // open vest: skin chest, red panels
    seg(c, hipX + px * 2 * s, hipY + py * 2 * s, tAng, 20 * s, torsoW * 0.34, pal.skin);
    seg(c, hipX - px * 4 * s, hipY - py * 4 * s, tAng, 20 * s, torsoW * 0.3, pal.jacket);
  } else if (type === 'bruiser' || type === 'boss') { // shoulder pads
    var pw = (type === 'boss' ? 17 : 12) * s;
    R(c, shX - pw / 2, shY - 6 * s, pw, 7 * s, pal.jshade);
    R(c, shX - pw / 2, shY - 6 * s, pw, 3 * s, pal.jacket);
  }
  if (type === 'boss') { // gold crown emblem on chest (original motif)
    drawCrown(c, shX - 2 * s, shY + 6 * s, 9 * s, 7 * s, '#ffe9a3', '#d83636');
  }

  // belt + buckle
  R(c, hipX - torsoW / 2 - 1 * s, hipY - 2 * s, torsoW + 2 * s, 4 * s, '#101018');
  var bkw = (type === 'boss' || type === 'bruiser') ? 6 * s : 4 * s;
  R(c, hipX + 1 * s, hipY - 2 * s, bkw, 4 * s, '#c9a227');

  // front leg
  var hipF = [hipX + 2.5 * s, hipY];
  var knF = seg(c, hipF[0], hipF[1], P.lF[0], 12 * s, legW, pal.pants);
  var anF = seg(c, knF[0], knF[1], P.lF[1], 12 * s, legW * 0.85, pal.pants);
  R(c, anF[0] - 1 * s, anF[1] - 2 * s, 8 * s, 5 * s, pal.boot);
  R(c, anF[0] - 1 * s, anF[1] - 2 * s, 8 * s, 2 * s, '#5a4a32'); // boot highlight

  // front arm
  var shF = [shX + 3 * s, shY + 1 * s];
  var elF = seg(c, shF[0], shF[1], P.aF[0], 10 * s, armW, pal.jacket);
  var fiF = seg(c, elF[0], elF[1], P.aF[1], 9 * s, armW * 0.9, pal.skin);
  R(c, fiF[0] - 3 * s, fiF[1] - 3 * s, 6 * s, 6 * s, pal.glove);
  R(c, fiF[0] - 3 * s, fiF[1] - 3 * s, 6 * s, 2 * s, 'rgba(255,255,255,0.35)'); // knuckle hi

  // weapon held overhead in swing pose (wooden club)
  if (pose === 'swing') {
    seg(c, fiF[0], fiF[1] - 2 * s, -115, 26 * s, 5 * s, '#8a5a2b');
    R(c, fiF[0] - 2 * s, fiF[1] - 4 * s, 5 * s, 6 * s, '#6e451f');
  }

  // head
  var hx = shX + Math.sin(lean) * 6 * s + P.head[0] * s - 6.5 * s;

  drawHeadgear(c, type, hx, hy, 13 * s, 12 * s, pal, s);
}

/* pose key selection from live fighter state */
var POSES = ['idle0', 'idle1', 'walk0', 'walk1', 'walk2', 'walk3',
  'punch_windup', 'punch_jab', 'punch_cross', 'punch_uppercut', 'punch_recover',
  'kick_chamber', 'kick_extended', 'jump', 'jumpkick', 'hit', 'down',
  'getup', 'swing', 'victory'];
function poseFor(f, isPlayer) {
  var st = f.state;
  if (st === 'down' || st === 'dead') return 'down';
  if (st === 'getup') return 'getup';
  if (st === 'hit') return 'hit';
  if (st === 'jumpkick') return 'jumpkick';
  if (st === 'jump') return 'jump';
  if (st === 'kick') return (f.stateT < 0.1) ? 'kick_chamber' : 'kick_extended';
  if (st === 'punch' || st === 'fin') {
    if (isPlayer && f.weapon) return 'swing';
    if (st === 'fin') return (f.stateT < 0.1) ? 'punch_windup' : 'punch_uppercut';
    var kind = (f.combo === 2) ? 'cross' : 'jab';
    if (f.stateT < 0.07) return 'punch_windup';
    if (f.stateT < 0.2) return kind === 'cross' ? 'punch_cross' : 'punch_jab';
    return 'punch_recover';
  }
  if (st === 'walk') return 'walk' + (Math.floor(f.walkPhase / 1.6) % 4);
  return (Math.floor(S.t * 2.4) % 2 === 0) ? 'idle0' : 'idle1';
}

var SIGN_W = 30, SIGN_H = 38;   // small-sign rule: framed wall signs only

function brickWall(c, x, y, w, h, base, mortar, bh) {
  R(c, x, y, w, h, base);
  var bwid = 16, bhgt = bh || 8;
  for (var ry = y; ry < y + h; ry += bhgt) {
    var off = ((ry / bhgt) % 2) * (bwid / 2);
    for (var rx = x - bwid; rx < x + w + bwid; rx += bwid) {
      R(c, rx + off + 1, ry + 1, bwid - 2, bhgt - 2, mortar);
    }
  }
}

function framedSign(c, wx, wy, artKey) {

  } else {

    var nx = Math.round(380 - S.scrollX + shx);
    if (nx > -60 && nx < W + 60) {
      var flick = (Math.floor(S.t * 9) % 7 === 0) ? 0.25 : 1;
      ctx.save();
      ctx.globalAlpha = 0.9 * flick;
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(nx, 40, 64, 26);
      ctx.fillStyle = '#ff5fa2';
      ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('CWI', nx + 32, 44);
      ctx.strokeStyle = '#ff5fa2';
      ctx.strokeRect(nx + 1.5, 41.5, 61, 23);
      ctx.restore();
    }
    // steam vent
    var sx2 = Math.round(650 - S.scrollX + shx);
    if (sx2 > -30 && sx2 < W + 30) {
      ctx.fillStyle = '#3a3a48';
      ctx.fillRect(sx2, 150, 18, 8);
      for (var p2 = 0; p2 < 3; p2++) {
        var py2 = 144 - ((S.t * 20 + p2 * 24) % 70);
        ctx.fillStyle = 'rgba(200,200,210,' + (0.2 - p2 * 0.05) + ')';
        ctx.beginPath();
        ctx.ellipse(sx2 + 9 + Math.sin(S.t * 2.4 + p2) * 7, py2, 8 + p2 * 3, 6 + p2 * 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else {
    // sweeping stage light beams from the rig
    var rx = Math.round(520 - S.scrollX + shx), rx2 = Math.round(640 - S.scrollX + shx);
    ctx.save();
    ctx.globalAlpha = 0.14;
    [[rx, '#ff5fa2'], [rx2, '#41d8e8']].forEach(function (bm, bi) {
      var sway = Math.sin(S.t * 1.4 + bi * 2.4) * 60;
      ctx.fillStyle = bm[1];
      ctx.beginPath();
      ctx.moveTo(bm[0] + 60, 40);
      ctx.lineTo(bm[0] + sway - 30, 210);
      ctx.lineTo(bm[0] + sway + 30, 210);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
    // hanging lamp glow pulse
    for (var hx = 120; hx < 900; hx += 260) {
      var lx = Math.round(hx - S.scrollX + shx);
      if (lx < -20 || lx > W + 20) continue;
      ctx.fillStyle = '#1c0a20';
      ctx.fillRect(lx, 0, 4, 18);
      var pulse = 0.5 + 0.5 * Math.sin(S.t * 3 + hx);
      ctx.fillStyle = 'rgba(255,233,163,' + (0.5 + 0.3 * pulse) + ')';
      ctx.beginPath(); ctx.arc(lx + 2, 24, 5, 0, Math.PI * 2); ctx.fill();
    }
  }
}

/* ---------------- fighters ---------------- */
function typeOf(f, isPlayer) { return isPlayer ? 'player' : (f.type || 'punk'); }

function drawFighter(f, isPlayer) {
  var type = typeOf(f, isPlayer);
  var shx = S.shake > 0 ? (Math.random() - 0.5) * 6 : 0;
  var shy = S.shake > 0 ? (Math.random() - 0.5) * 4 : 0;
  var sx = Math.round(f.x - S.scrollX + shx);
  var gy = Math.round(f.y + shy);
  var z = f.z || 0;
  if (sx < -90 || sx > W + 90) return;
  var pose = poseFor(f, isPlayer);
  var spr = SPR[type][pose];
  var dw = spr.width, dh = spr.height;

  // dust on knockdown / landing (render-side juice, logic untouched)
  if (f._pv !== f.state) {
    if (f.state === 'down') puffDust(sx, gy, 7, 90);
    f._pv = f.state;
  }
  if (f._pz > 0 && z === 0 && (f.state === 'jump' || f.state === 'jumpkick' || f.state === 'idle' || f.state === 'walk')) {
    puffDust(sx, gy, 3, 50);
  }
  f._pz = z;

  // shadow
  var shScale = Math.max(0.3, 1 - z / 160);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(sx, gy + 3, 13 * FSCALE[type] * shScale, 4.5 * FSCALE[type] * shScale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(sx, gy - z);
  if (f.iframes > 0 && Math.floor(S.t * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.scale(f.facing, 1);
  try {
    ctx.drawImage(spr, -dw / 2, -dh + 3);
  } catch (e) { /* canvas shim safety */ }
  ctx.restore();

  // hit flash: white silhouette pop on fresh hits
  if (f.state === 'hit' && f.stateT < 0.08) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx - dw / 2, gy - z - dh + 3, dw, dh);
    ctx.restore();
  }

  // enemy hp pips
  if (!isPlayer && f.hp < f.maxHp && f.state !== 'dead') {
    var wpx = 34 * FSCALE[type];
    var top = gy - z - dh - 4;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(sx - wpx / 2, top, wpx, 5);
    ctx.fillStyle = f.type === 'boss' ? '#c9a227' : '#ff5252';
    ctx.fillRect(sx - wpx / 2 + 1, top + 1, (wpx - 2) * (f.hp / f.maxHp), 3);
  }
  // name tag for boss
  if (!isPlayer && f.type === 'boss' && f.state !== 'dead') {
    txt('BIG CHROME', sx, gy - z - dh - 18, 8, '#c9a227', 'center');
  }
}

function drawWeaponPickup(wp) {
  var sx = Math.round(wp.x - S.scrollX);
  if (sx < -20 || sx > W + 20) return;
  ctx.fillStyle = 'rgba(65,216,232,0.25)';
  ctx.beginPath(); ctx.ellipse(sx, wp.y + 2, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(sx, wp.y - 4 + Math.sin(S.t * 4) * 2);
  ctx.rotate(-0.5);
  if (wp.kind === 'bat') {
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(-3, -14, 6, 28);
    ctx.fillStyle = '#6e451f';
    ctx.fillRect(-3, 8, 6, 6);
  } else {
    ctx.fillStyle = '#2fae5f';
    ctx.fillRect(-4, -8, 8, 16);
    ctx.fillStyle = '#1d7a42';
    ctx.fillRect(-2, -12, 4, 5);
  }
  ctx.restore();
}

/* ---------------- background ---------------- */
function drawBackground() {
  var idx = S.stageIdx;
  var shx = S.shake > 0 ? (Math.random() - 0.5) * 6 : 0;
  var shy = S.shake > 0 ? (Math.random() - 0.5) * 4 : 0;
  // far tile (parallax 0.25)
  var far = FAR[idx], fx = -((S.scrollX * 0.25) % 480);
  try {
    ctx.drawImage(far, Math.round(fx), 0);
    ctx.drawImage(far, Math.round(fx) + 480, 0);
  } catch (e) {}
  // mid tile (parallax 0.55)
  var mid = MID[idx], mx = -((S.scrollX * 0.55) % 480);
  try {
    ctx.drawImage(mid, Math.round(mx), 66);
    ctx.drawImage(mid, Math.round(mx) + 480, 66);
  } catch (e) {}
  // near strip (parallax 1.0)
  try {
    ctx.drawImage(NEAR[idx], Math.round(-S.scrollX + shx), Math.round(shy));
  } catch (e) {}
  drawStageFx();
  // arena barrier when locked
  if (S.arena) {
    ctx.fillStyle = 'rgba(201,162,39,0.85)';
    ctx.fillRect(W - 8, 60, 8, 140);
    ctx.fillRect(0, 60, 8, 140);
    txt('LOCKED', W / 2, 66, 9, '#c9a227', 'center');
  }
}

/* ---------------- HUD: portrait boxes, named bars, arcade text ---------------- */
function drawPortraitBox(x, y, type, name, hpFrac, barColor) {
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(x, y, 26, 26);
  ctx.fillStyle = '#c9a227';
  ctx.fillRect(x, y, 26, 2); ctx.fillRect(x, y + 24, 26, 2);
  ctx.fillRect(x, y, 2, 26); ctx.fillRect(x + 24, y, 2, 26);
  try { ctx.drawImage(PORTRAIT[type], x + 2, y + 2, 22, 22); } catch (e) {}
  txt(name, x + 30, y - 1, 9, '#fff');
  // segmented POW-style hp bar
  var bx = x + 30, bw = 84;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(bx - 1, y + 11, bw + 2, 9);
  var segs = 10, on = Math.ceil(hpFrac * segs);
  for (var i = 0; i < segs; i++) {
    ctx.fillStyle = i < on ? barColor : '#2a2a34';
    ctx.fillRect(bx + i * (bw / segs) + 1, y + 12, bw / segs - 2, 7);
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 30);
  var p = S.player;
  drawPortraitBox(6, 2, 'player', 'REY', p.hp / p.maxHp, p.hp > 30 ? '#41d8e8' : '#ff5252');
  txt('SCORE ' + String(S.score).padStart(6, '0'), 8, 32, 9, '#fff');
  // center: stage + time
  var st = S.stages[S.stageIdx];
  txt('TIME ' + Math.ceil(stageClock), W / 2, 3, 10, '#ffd23f', 'center');
  txt('STG ' + (S.stageIdx + 1) + ' ' + st.name, W / 2, 16, 8, '#17c3b2', 'center');
  // right: lives + credit
  txt('LIVES ' + String(Math.max(S.lives, 0)).padStart(2, '0'), W - 8, 3, 9, '#ff6b8a', 'right');
  txt('CREDIT 00', W - 8, 16, 8, '#ffd23f', 'right');
  if (S.paused) txt('II', W - 20, 32, 10, '#ffd23f');
  // boss bar with portrait
  if (S.boss) {
    var b = S.boss;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W / 2 - 96, H - 20, 192, 14);
    try { ctx.drawImage(PORTRAIT.boss, W / 2 - 94, H - 19, 12, 12); } catch (e) {}
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(W / 2 - 78, H - 16, 166 * (b.hp / b.maxHp), 6);
    ctx.strokeStyle = '#c9a227';
    ctx.strokeRect(W / 2 - 78.5, H - 16.5, 167, 7);
    txt('BIG CHROME', W / 2 + 10, H - 32, 8, '#c9a227', 'center');
  }
  // combo counter
  if (p.combo >= 2 && p.comboT > 0) txt(p.combo + ' HITS!', W - 8, 32, 10, '#ffd23f', 'right');
  // message banner
  if (S.msg) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    var mw = ctx.measureText ? 0 : 0;
    txt(S.msg, W / 2, 88, 13, '#ffd23f', 'center');
  }
}

/* ---------------- particles: impact stars, embers, capped ---------------- */
function drawParticles() {
  var list = S.particles;
  var n = Math.min(list.length, 120); // hard cap: perf before detail
  for (var i = 0; i < n; i++) {
    var pt = list[i];
    var a = 1 - pt.t / pt.life;
    var psx = Math.round(pt.x - S.scrollX);
    var psy = Math.round(pt.y - pt.z);
    if ((pt.color === '#ffd23f' || pt.color === '#ff5252') && pt.t < 0.15) {
      // impact star: 4-point burst
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(psx, psy);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#ffffff';
      var r = pt.size + 5;
      ctx.fillRect(-r, -1.5, r * 2, 3);
      ctx.fillRect(-1.5, -r, 3, r * 2);
      ctx.fillStyle = pt.color;
      ctx.fillRect(-r + 2, -1, (r - 2) * 2, 2);
      ctx.fillRect(-1, -r + 2, 2, (r - 2) * 2);
      ctx.restore();
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.fillRect(psx - pt.size / 2, psy - pt.size / 2, pt.size, pt.size);
      ctx.globalAlpha = 1;
    }
  }
  // render-side dust
  for (var d = 0; d < vdust.length; d++) {
    var q = vdust[d];
    ctx.globalAlpha = 0.5 * (1 - q.t / q.life);
    ctx.fillStyle = '#b8b0a0';
    ctx.beginPath();
    ctx.ellipse(q.x - S.scrollX, q.y, 5 + q.t * 14, 3 + q.t * 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------------- screens ---------------- */
function drawMarqueeTitle() {
  // gold-marquee STREET KINGS with original crown motif
  drawCrown(ctx, W / 2 - 30, 34, 60, 34, '#c9a227', '#d83636');
  ctx.fillStyle = 'rgba(255,233,163,0.25)';
  ctx.fillRect(W / 2 - 110, 76, 220, 3);
  goldTxt('STREET', W / 2, 84, 34, 'center');
  goldTxt('KINGS', W / 2, 118, 34, 'center');
  ctx.fillStyle = 'rgba(255,233,163,0.25)';
  ctx.fillRect(W / 2 - 110, 156, 220, 3);
}
function drawTitle() {
  // stage-1 sunset backdrop, dimmed
  var far = FAR[0];
  try { ctx.drawImage(far, 0, 0); ctx.drawImage(far, 240, 0); } catch (e) {}
  var mid = MID[0];
  try { ctx.drawImage(mid, 0, 66); } catch (e) {}
  ctx.fillStyle = 'rgba(5,5,12,0.62)';
  ctx.fillRect(0, 0, W, H);
  var logo = ART['cwi-logo'];
  if (logo && logo.complete && logo.naturalWidth) {
    try { ctx.drawImage(logo, 14, 12, 40, 40); } catch (e) {}
  } else {
    ctx.fillStyle = '#17c3b2';
    ctx.beginPath(); ctx.arc(34, 32, 17, 0, Math.PI * 2); ctx.fill();
    txt('CWI', 34, 26, 10, '#0a0a12', 'center');
  }
  txt('CUMULATIVE WEB INC', W - 14, 16, 8, '#17c3b2', 'right');
  drawMarqueeTitle();
  // hero + boss sprites flanking the marquee
  try {
    ctx.drawImage(SPR.player.victory, 36, 120, 56, 64);
    ctx.drawImage(SPR.boss.idle0, W - 108, 108, 81, 92);
  } catch (e) {}
  txt('The Chrome Vipers are smashing the block.', W / 2, 168, 8, '#ccc', 'center');
  txt('Rey takes back the neon streets.', W / 2, 179, 8, '#ccc', 'center');
  if (Math.floor(S.t * 2) % 2 === 0) goldTxt('TAP OR PRESS ENTER', W / 2, 192, 11, 'center');
  txt('J PUNCH · K KICK · SPACE JUMP', W / 2, 206, 7, '#777', 'center');
}

function drawEnd(win) {
  drawBackground();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  if (win) {
    try { ctx.drawImage(SPR.player.victory, W / 2 - 42, 40, 84, 96); } catch (e) {}
    goldTxt('BLOCK RECLAIMED!', W / 2, 140, 20, 'center');
  } else {
    txt('GAME OVER', W / 2, 60, 22, '#ff5252', 'center');
  }
  txt('SCORE ' + String(S.score).padStart(6, '0'), W / 2, 164, 12, '#fff', 'center');
  if (win) {
    txt('The Kings own the neon streets again.', W / 2, 180, 8, '#17c3b2', 'center');
  } else {
    txt('The Vipers hold the block... for now.', W / 2, 132, 8, '#888', 'center');
  }
  txt('CREDIT 00', W / 2, 192, 8, '#ffd23f', 'center');
  if (Math.floor(S.t * 2) % 2 === 0) txt('TAP OR PRESS ENTER', W / 2, 202, 9, '#fff', 'center');
}

function render() {
  ctx.save();
  if (S.screen === 'title') { drawTitle(); }
  else if (S.screen === 'gameover') { drawEnd(false); }
  else if (S.screen === 'victory') { drawEnd(true); }
  else {
    drawBackground();
    // depth sort: weapons, fighters by y
    var draws = [];
    for (var i = 0; i < S.weapons.length; i++) draws.push({ y: S.weapons[i].y, k: 'w', o: S.weapons[i] });
    draws.push({ y: S.player.y, k: 'p', o: S.player });
    for (var j = 0; j < S.enemies.length; j++) draws.push({ y: S.enemies[j].y, k: 'e', o: S.enemies[j] });
    draws.sort(function (a, b) { return a.y - b.y; });
    for (var d = 0; d < draws.length; d++) {
      var it = draws[d];
      if (it.k === 'w') drawWeaponPickup(it.o);
      else if (it.k === 'p') drawFighter(it.o, true);
      else drawFighter(it.o, false);
    }
    drawParticles();
    drawHUD();
    if (S.paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      txt('PAUSED', W / 2, 96, 20, '#ffd23f', 'center');
      txt('P / TAP TO RESUME', W / 2, 126, 9, '#fff', 'center');
    }
  }
  ctx.restore();
}

/* test/config surface (node harness) */
if (typeof global !== 'undefined') {
  global.__CFG = { signW: SIGN_W, signH: SIGN_H, spriteFrames: SPRITE_COUNT, poses: POSES.length };
}

/* ---------------- boot ---------------- */
queueFrame();

})();

</script>
