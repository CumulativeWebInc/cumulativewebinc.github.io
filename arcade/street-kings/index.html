<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }

  body { display:flex; align-items:center; justify-content:center; font-family:monospace; color:#fff; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px; width:100%; max-width:860px; }
  #game { image-rendering:pixelated; image-rendering:crisp-edges; background:#0a0a12;

  #actions { display:flex; gap:10px; }
  .tbtn { user-select:none; -webkit-user-select:none; touch-action:none;
          background:#1a1a26; border:2px solid #17c3b2; color:#17c3b2; border-radius:12px;
          font-family:monospace; font-size:18px; font-weight:bold; text-align:center;
          display:flex; align-items:center; justify-content:center; cursor:pointer; min-height:44px; }
  .tbtn:active { background:#17c3b2; color:#0a0a12; }
  #dpad .tbtn { font-size:20px; }
  .abtn { width:84px; height:76px; font-size:15px; }
  #btn-punch { border-color:#ff6b8a; color:#ff6b8a; }
  #btn-punch:active { background:#ff6b8a; color:#0a0a12; }
  #btn-kick { border-color:#ffd23f; color:#ffd23f; }
  #btn-kick:active { background:#ffd23f; color:#0a0a12; }
  #btn-jump { border-color:#7b3fd4; color:#c9a9f5; }
  #btn-jump:active { background:#7b3fd4; color:#0a0a12; }
  #btn-pause { position:fixed; top:10px; right:10px; z-index:50; width:44px; height:44px;
          background:#1a1a26; border:2px solid #ffd23f; color:#ffd23f; border-radius:10px;
          font-size:18px; display:flex; align-items:center; justify-content:center; }
  #hint { font-size:10px; color:#666; text-align:center; line-height:1.5; user-select:none; -webkit-user-select:none; }
</style>

/* ===== logic.js (pure game core, zero DOM) ===== */
/* ============================================================
   STREET KINGS — pure game logic core (no DOM, no audio, no window)
   Original side-scrolling beat-'em-up. Clean-room genre mechanics:
   walk / punch / kick / jump / combos / weapons / waves / boss.
   IP-CLEAN: genre-inspired only. Original title, fighters, story, gangs,
   art, music, SFX — nothing borrowed from any existing game.
   Usable from node (tests) and browser (game) alike.
   ============================================================ */
var SK = (function () {
'use strict';

/* ---------------- utils ---------------- */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function sgn(v) { return v < 0 ? -1 : 1; }

/* ---------------- constants ---------------- */
var W = 384, H = 216;
var Y_MIN = 128, Y_MAX = 196;   // walkable depth band
var GRAV = 1500;                // jump gravity px/s^2
var JUMP_V = 520;               // jump velocity -> apex ~90px
var WALK = 110;                 // player px/s
var EXTRA_LIFE_AT = 15000;

var P_HP = 100;
var PUNCH = { dmg: 8,  range: 28, startup: 0.07, active: 0.13, recover: 0.16 };
var KICK  = { dmg: 12, range: 34, startup: 0.10, active: 0.14, recover: 0.22 };
var FIN   = { dmg: 16, range: 34, startup: 0.10, active: 0.14, recover: 0.26 }; // 3rd-hit finisher

var WEAPONS = {
  bat:    { dmg: 18, range: 42, uses: 3, label: 'BAT' },

};

    weapons: [],               // ground pickups {kind,x,y,uses}
    enemies: [],
    prevInput: {},
    player: null,
    shake: 0
  };
  resetPlayer(S, true);

}

function resetPlayer(S, full) {
  S.player = {
    x: S.scrollX + 70, y: 165, z: 0, vz: 0,
    hp: P_HP, maxHp: P_HP,
    facing: 1, state: 'idle', stateT: 0,
    combo: 0, comboT: 0,
    weapon: null,              // {kind, uses}
    iframes: 0, walkPhase: 0,
    hitDone: false, downT: 0

}

function startPlay(S) {
  S.screen = 'play';
  S.stageIdx = 0; S.scrollX = 0; S.waveIdx = 0; S.arena = null;
  S.enemies = []; S.weapons = []; S.particles = []; S.boss = null;
  S.score = 0; S.lives = 3; S.extraLifeGiven = false;
  resetPlayer(S, false);
  S.player.hp = P_HP;
  S.msg = 'STAGE 1 — NEON ROW'; S.msgT = 2.2;
  S.sfx.push('start');
}

/* ---------------- helpers ---------------- */
function curStage(S) { return S.stages[S.stageIdx]; }
function sfx(S, n) { if (S.sfx.length < 24) S.sfx.push(n); }
function addScore(S, n) {
  S.score += n;
  if (!S.extraLifeGiven && S.score >= EXTRA_LIFE_AT) {
    S.extraLifeGiven = true; S.lives++;
    S.msg = 'EXTRA LIFE!'; S.msgT = 2.0; sfx(S, 'extralife');
  }
}
function spark(S, x, y, z, color, n) {
  for (var i = 0; i < n; i++) {
    S.particles.push({
      x: x + (S.rng() - 0.5) * 10, y: y - 14 + (S.rng() - 0.5) * 14, z: z + S.rng() * 8,
      vx: (S.rng() - 0.5) * 160, vy: (S.rng() - 0.5) * 60, vz: S.rng() * 120,
      life: 0.35 + S.rng() * 0.2, t: 0, color: color, size: 2 + S.rng() * 2

  }
}
function inRange(ax, ay, az, bx, by, bz, rx, ry, rz) {
  return Math.abs(ax - bx) < rx && Math.abs(ay - by) < ry && Math.abs(az - bz) < rz;
}

/* ---------------- enemies ---------------- */
function spawnEnemy(S, type, wx, wy) {
  var T = ETYPES[type];
  var e = {
    type: type, name: ENEMY_NAMES[type],
    x: wx, y: clamp(wy, Y_MIN, Y_MAX), z: 0, vz: 0,
    hp: T.hp, maxHp: T.hp, speed: T.speed, dmg: T.dmg, atkCdMax: T.cd,
    score: T.score, w: T.w, h: T.h,
    facing: -1, state: 'spawn', stateT: 0, atkCd: 0.4 + S.rng() * 0.8,
    hitDone: false, iframes: 0, walkPhase: S.rng() * 6, dead: false, deathT: 0,
    strafe: (S.rng() - 0.5) * 40
  };
  S.enemies.push(e);
  if (type === 'boss') { S.boss = e; S.msg = 'BIG CHROME'; S.msgT = 2.0; sfx(S, 'boss'); }
  return e;
}

function spawnWave(S, wave) {
  var cx = S.scrollX + W / 2;
  for (var i = 0; i < wave.comp.length; i++) {
    var side = (i % 2 === 0) ? 1 : -1;
    var wx = side > 0 ? S.scrollX + W + 24 + i * 26 : S.scrollX - 24 - i * 26;
    var wy = Y_MIN + 12 + S.rng() * (Y_MAX - Y_MIN - 24);
    spawnEnemy(S, wave.comp[i], wx, wy);
  }
  sfx(S, 'wave');
}

function hurtEnemy(S, e, dmg, dir, knockdown) {
  if (e.iframes > 0 || e.state === 'dead') return;
  e.hp -= dmg;
  e.facing = sgn(-dir) || 1;
  spark(S, e.x, e.y, e.z + 10, '#ffd23f', 5);
  if (e.hp <= 0) {
    e.hp = 0; e.state = 'dead'; e.deathT = 0; e.z = Math.max(e.z, 0);
    sfx(S, e.type === 'boss' ? 'bossko' : 'ko');
    spark(S, e.x, e.y, e.z + 10, '#ff5252', 10);
    addScore(S, e.score);
    // bruisers sometimes drop a bat
    if (e.type === 'bruiser' && S.rng() < 0.5) {
      S.weapons.push({ kind: 'bat', x: e.x, y: e.y, uses: WEAPONS.bat.uses });
    }
    if (e === S.boss) S.boss = null;
    return;
  }
  sfx(S, 'hit');
  if (knockdown || (e.type === 'punk' && dmg >= 14)) {
    e.state = 'down'; e.stateT = 0; e.vz = 160; // pop up, gravity slams down
  } else {
    e.state = 'hit'; e.stateT = 0;
  }
  e.x += dir * (knockdown ? 26 : 10);
}

function enemyStrike(S, e) {
  var p = S.player;
  if (p.iframes > 0 || p.state === 'down' || p.state === 'dead') return;
  var range = e.type === 'boss' ? 34 : 28;
  if (inRange(e.x, e.y, e.z, p.x, p.y, p.z, range, 12, 18)) {
    hurtPlayer(S, e.dmg, sgn(p.x - e.x) || 1, e.type === 'boss');
  }
}

function hurtPlayer(S, dmg, dir, heavy) {
  var p = S.player;
  if (p.iframes > 0 || p.state === 'down' || p.state === 'dead' || S.screen !== 'play') return;
  p.hp -= dmg;
  spark(S, p.x, p.y, p.z + 12, '#ff5252', 6);
  sfx(S, 'phit');
  S.shake = 0.18;
  if (p.weapon && (heavy || p.hp <= 0)) { // drop weapon on knockdown
    S.weapons.push({ kind: p.weapon.kind, x: p.x, y: clamp(p.y, Y_MIN, Y_MAX), uses: p.weapon.uses });
    p.weapon = null;
  }
  if (p.hp <= 0) {
    p.hp = 0;
    p.state = 'down'; p.stateT = 0; p.vz = 200; p.downT = 1.4; // long knockdown = death check at land
    sfx(S, 'pdown');
    return;
  }
  if (heavy) { p.state = 'down'; p.stateT = 0; p.vz = 170; p.downT = 0.9; sfx(S, 'pdown'); }
  else { p.state = 'hit'; p.stateT = 0; }
  p.x += dir * 12;
  p.iframes = 0.7;
}

function updateEnemy(S, e, dt) {
  var p = S.player;
  e.stateT += dt;
  if (e.iframes > 0) e.iframes -= dt;
  if (e.atkCd > 0) e.atkCd -= dt;

  // gravity for pop-up knockdowns
  if (e.z > 0 || e.vz !== 0) {
    e.vz -= GRAV * dt; e.z += e.vz * dt;
    if (e.z <= 0) { e.z = 0; e.vz = 0; }
  }

  switch (e.state) {
    case 'spawn':
      if (e.stateT > 0.45) { e.state = 'walk'; e.stateT = 0; }
      break;
    case 'walk': {
      if (p.state === 'dead' || S.screen !== 'play') break;
      var dx = p.x - e.x, dy = (p.y + e.strafe * 0.2) - e.y;
      e.facing = sgn(dx) || e.facing;
      var adx = Math.abs(dx), ady = Math.abs(dy);
      if (adx < 30 && ady < 11 && e.z === 0 && p.z < 18) {
        if (e.atkCd <= 0) { e.state = 'attack'; e.stateT = 0; e.hitDone = false; }
      } else {
        var sp = e.speed;
        if (adx > 24) e.x += sgn(dx) * sp * dt;
        if (ady > 7) e.y += sgn(dy) * sp * 0.72 * dt;
        e.walkPhase += dt * 10;
      }
      e.x = clamp(e.x, S.scrollX - 60, S.scrollX + W + 60);
      e.y = clamp(e.y, Y_MIN, Y_MAX);
      break;
    }
    case 'attack': {
      var T = ETYPES[e.type];
      var windup = e.type === 'boss' ? 0.4 : 0.32;
      e.facing = sgn(p.x - e.x) || e.facing;
      if (!e.hitDone && e.stateT >= windup) { e.hitDone = true; enemyStrike(S, e); sfx(S, 'eswing'); }
      if (e.stateT > windup + 0.25) { e.state = 'walk'; e.stateT = 0; e.atkCd = T.cd * (0.85 + S.rng() * 0.3); }
      break;
    }
    case 'hit':
      if (e.stateT > 0.28) { e.state = 'walk'; e.stateT = 0; }
      break;
    case 'down':
      if (e.z === 0 && e.stateT > 0.85) { e.state = 'getup'; e.stateT = 0; e.iframes = 0.8; }
      break;
    case 'getup':
      if (e.stateT > 0.4) { e.state = 'walk'; e.stateT = 0; }
      break;
    case 'dead':
      e.deathT += dt;
      break;
  }
}

/* ---------------- player combat ---------------- */
function playerAttackDef(p) {

    if (d < bd) { bd = d; best = e; }

    if (p.weapon) {
      p.weapon.uses--;
      addScore(S, 25);
      if (p.weapon.uses <= 0) { p.weapon = null; sfx(S, 'break'); spark(S, p.x + dir * 20, p.y, 20, '#c9a227', 8); }
    }

  }

function updatePlayer(S, inp, dt) {
  var p = S.player;
  p.stateT += dt;
  if (p.iframes > 0) p.iframes -= dt;
  if (p.comboT > 0) { p.comboT -= dt; if (p.comboT <= 0) p.combo = 0; }

  // gravity
  if (p.z > 0 || p.vz !== 0) {
    p.vz -= GRAV * dt; p.z += p.vz * dt;
    if (p.z <= 0) {
      p.z = 0; p.vz = 0;
      if (p.state === 'jump' || p.state === 'jumpkick') { p.state = 'idle'; p.stateT = 0; }
    }
  }

  var st = curStage(S);
  var attacking = (p.state === 'punch' || p.state === 'kick' || p.state === 'fin' || p.state === 'jumpkick');

  switch (p.state) {
    case 'idle':
    case 'walk': {
      var mx = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      var my = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
      if (mx !== 0 || my !== 0) {
        p.state = 'walk';
        p.x += mx * WALK * dt;
        p.y += my * WALK * 0.72 * dt;
        p.walkPhase += dt * 11;

      } else p.state = 'idle';
      p.x = clamp(p.x, S.scrollX + 14, S.scrollX + W - 14);
      p.y = clamp(p.y, Y_MIN, Y_MAX);
      // scroll follows when pushing right past 62%

        p.hitDone = true; applyPlayerHit(S);

      if (p.stateT > def.startup + def.active + def.recover) { p.state = 'idle'; p.stateT = 0; }
      break;
    }
    case 'jump':
    case 'jumpkick': {
      var mx2 = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      p.x += mx2 * WALK * 0.9 * dt;

      if (p.state === 'jumpkick' && !p.hitDone) { p.hitDone = true; applyPlayerHit(S); }
      break;
    }
    case 'hit':
      if (p.stateT > 0.3) { p.state = 'idle'; p.stateT = 0; }
      break;

        else { p.state = 'getup'; p.stateT = 0; p.iframes = 0.9; }
      }
      break;

      if (p.stateT > 0.4) { p.state = 'idle'; p.stateT = 0; }
      break;
    case 'dead':
      break;

  if (inp.punch && !S.prevInput.punch) tryAttack(S, 'punch');
  if (inp.kick && !S.prevInput.kick) tryAttack(S, 'kick');
  if (inp.jump && !S.prevInput.jump && p.z === 0 &&
      (p.state === 'idle' || p.state === 'walk')) {

  }
}

function playerDie(S) {
  var p = S.player;

  sfx(S, 'pdead');
  spark(S, p.x, p.y, 20, '#ff5252', 14);

    p.state = 'dead'; S.screen = 'gameover'; S.msg = ''; return;
  }

  p.hp = P_HP; p.state = 'idle'; p.stateT = 0; p.z = 0; p.vz = 0;
  p.weapon = null; p.iframes = 2.0; p.combo = 0; p.comboT = 0;
  p.x = S.scrollX + 70; p.y = 165;
  for (var i = 0; i < S.enemies.length; i++) S.enemies[i].atkCd = Math.max(S.enemies[i].atkCd, 1.2);
  S.msg = 'REY IS DOWN — ' + S.lives + (S.lives === 1 ? ' LIFE' : ' LIVES') + ' LEFT';
  S.msgT = 2.0;

      if (S.enemies[i].state !== 'dead') { live = true; break; }

      S.arena = null; S.waveIdx++;
      sfx(S, 'clear');
      if (S.waveIdx >= st.waves.length) stageClear(S);
      else { S.msg = 'WAVE DOWN'; S.msgT = 1.4; }
    }
    return;
  }
  if (S.waveIdx < st.waves.length) {
    var wv = st.waves[S.waveIdx];
    if (S.scrollX >= wv.x) { S.arena = wv; spawnWave(S, wv); }
  }

function stageClear(S) {
  if (S.stageIdx >= S.stages.length - 1) {
    S.screen = 'victory';
    addScore(S, 5000);
    sfx(S, 'victory');
    return;
  }
  S.stageIdx++;
  var st = curStage(S);
  S.scrollX = 0; S.waveIdx = 0; S.arena = null;
  S.enemies = []; S.weapons = []; S.boss = null;
  var p = S.player;
  p.x = 70; p.y = 165; p.z = 0; p.vz = 0; p.hp = P_HP;
  p.state = 'idle'; p.stateT = 0; p.weapon = null; p.iframes = 1.5;
  S.msg = 'STAGE ' + (S.stageIdx + 1) + ' — ' + st.name; S.msgT = 2.4;
  sfx(S, 'stageclear');

/* ============================================================

   Presentation: the game fills the whole viewport (zero letterbox bars).
   An aspect-adaptive camera frames the full 216-unit world height so a
   standing fighter is ~33% of the viewport height and follows the action
   horizontally; the scene is drawn edge to edge underneath and the arcade
   HUD sits directly on the art.
   Fighters are original pre-rendered chunky-pixel sprites (idle/walk/
   punch/kick/jump/jumpkick/hit/down/getup/swing/victory). Three themed
   stages, each with one big original set-piece. Cover art appears ONLY as

/* ---------------- camera: full-bleed adaptive viewport ----------------

/* ---------------- game state ---------------- */
var S = SK.newGame(20260927);
var acc = 0, lastT = 0;
var STEP = 1 / 60;
var hitstop = 0;            // KO hit-stop freeze (render layer only)
var stageClock = 99;        // cosmetic arcade stage timer
var lastStageIdx = -1;
var vdust = [];             // render-side dust puffs {x,y,vx,vy,t,life}

function frame(tms) {
  var t = tms / 1000;
  if (!lastT) lastT = t;
  var dt = Math.min(t - lastT, 0.1);
  lastT = t;
  if (hitstop > 0) { hitstop -= dt; updateDust(dt); render(); queueFrame(); return; }
  acc += dt;
  var n = 0;
  while (acc >= STEP && n < 5) {
    var snap = {
      left: input.left, right: input.right, up: input.up, down: input.down,
      punch: input.punch, kick: input.kick, jump: input.jump,
      start: input.start || tapStart
    };
    SK.update(S, snap, STEP);
    var q = SK.drainSfx(S);
    for (var i = 0; i < q.length; i++) {
      sfxPlay(q[i]);
      if (q[i] === 'ko') { hitstop = Math.max(hitstop, 0.1); S.shake = Math.max(S.shake, 0.22); }
      if (q[i] === 'bossko') { hitstop = Math.max(hitstop, 0.2); S.shake = Math.max(S.shake, 0.3); }
      if (q[i] === 'pdead') { hitstop = Math.max(hitstop, 0.25); }
      if (q[i] === 'pdown') { S.shake = Math.max(S.shake, 0.2); }
    }
    tapStart = false;
    acc -= STEP; n++;
  }
  if (n === 5) acc = 0;
  if (S.stageIdx !== lastStageIdx) { lastStageIdx = S.stageIdx; stageClock = 99; }
  if (S.screen === 'play' && !S.paused) stageClock = Math.max(0, stageClock - dt);

    d.x += d.vx * dt; d.y += d.vy * dt; d.vy -= 30 * dt;

      P.lF = [82, 92]; P.lB = [98, 88]; break;
  }
  return P;
}

function drawHeadgear(c, type, hx, hy, hw, hh, pal, s, flat) {
  // flat=1: compact headgear for the 24x24 HUD portraits (no tall hair)
  var hairH = flat ? 4 : 7, mohH = flat ? 7 : 13;
  if (type === 'player') {           // black hair mass + teal headband, knot tails
    R(c, hx - 2, hy - (hairH - 1) * s, hw + 3, hairH * s, pal.hair);
    R(c, hx - 2, hy - (hairH - 1) * s, 6 * s, (hairH + 6) * s, pal.hair);
    R(c, hx - 2, hy - (hairH - 1) * s, hw + 3, 2 * s, 'rgba(255,255,255,0.14)');
    rectO(c, hx - 1, hy + 2, hw + 2, 4 * s, '#17c3b2');
    R(c, hx - 1, hy + 2, hw + 2, 1.6 * s, '#7df2e6');
    R(c, hx - 7 * s, hy + 4, 6 * s, 2.6 * s, '#0d7a70');
    R(c, hx - 9 * s, hy + 6, 3.4 * s, 6 * s, '#0d7a70');
  } else if (type === 'punk') {      // tall red mohawk fin, dark roots, shine
    rectO(c, hx + hw / 2 - 2.6 * s, hy - mohH * s, 5.6 * s, (mohH + 1) * s, pal.hair);
    R(c, hx + hw / 2 - 2.6 * s, hy - mohH * s, 2 * s, (mohH + 1) * s, pal.hairsh);
    R(c, hx + hw / 2 + 2 * s, hy - mohH * s, 1 * s, (mohH + 1) * s, 'rgba(255,255,255,0.28)');
    R(c, hx + hw / 2 - 2.6 * s, hy - 3 * s, 5.6 * s, 4 * s, pal.hairsh);
  } else if (type === 'bruiser') {   // dark hair + purple bandana, knot + tails
    R(c, hx - 1, hy - 4 * s, hw + 2, 5 * s, pal.hair);
    rectO(c, hx - 1, hy + 1, hw + 2, 4.4 * s, '#7b3fd4');
    R(c, hx - 1, hy + 1, hw + 2, 1.6 * s, '#c49aff');
    R(c, hx + hw - 2, hy + 4, 5.4 * s, 3.4 * s, '#47208c');
    R(c, hx + hw + 2.4, hy + 5, 3.2 * s, 7 * s, '#47208c');
  } else {                            // boss: chrome dome shine + heavy brow + earring
    R(c, hx, hy - 1.5 * s, hw, 5 * s, '#c8c8d8');
    R(c, hx + 2.4 * s, hy - 1.5 * s, hw - 5 * s, 2.2 * s, '#f4f4f4');
    R(c, hx, hy + 3.5 * s, hw, 2 * s, 'rgba(0,0,0,0.22)');
    R(c, hx + hw - 11 * s, hy + 3.4 * s, 11 * s, 3.2 * s, 'rgba(40,30,10,0.6)');
    R(c, hx + 2.6 * s, hy + 9 * s, 2.2 * s, 3.4 * s, '#c9a227');
    R(c, hx + 2.6 * s, hy + 9 * s, 2.2 * s, 1.2 * s, '#ffe9a3');
  }
  // brow shadow, eyes (face +x), pupils, glints, nose, mouth, ear
  R(c, hx + hw - 10 * s, hy + 4.6 * s, 10 * s, 2.6 * s, 'rgba(60,20,10,0.5)');
  R(c, hx + hw - 8.6 * s, hy + 7 * s, 3.2 * s, 3.2 * s, '#f4f0e8');
  R(c, hx + hw - 5 * s, hy + 7 * s, 2.8 * s, 3.2 * s, '#f4f0e8');
  R(c, hx + hw - 7.6 * s, hy + 8 * s, 1.6 * s, 2.2 * s, '#101018');
  R(c, hx + hw - 4.6 * s, hy + 8 * s, 1.6 * s, 2.2 * s, '#101018');
  R(c, hx + hw - 7.6 * s, hy + 8 * s, 1 * s, 1 * s, '#ffffff');
  R(c, hx + hw - 3.2 * s, hy + 9.6 * s, 2.2 * s, 2.2 * s, pal.sksh);
  R(c, hx + hw - 8.6 * s, hy + 12.6 * s, 5.4 * s, 1.6 * s, '#6e3a26');
  R(c, hx + 1.6 * s, hy + 7.4 * s, 2.6 * s, 4.2 * s, pal.sksh);
}

function drawFighterArt(c, type, pose, cw, ch) {
  var pal = PALS[type], s = FSCALE[type];
  var cx = cw / 2, feet = ch - 3 * s;
  var P = poseParams(pose, type);
  var torsoW = TORSO_W[type] * s, armW = 9.5 * s, legW = 10.5 * s;

  if (pose === 'down') { // knocked flat — sprawled heavy body (compact: ds scale)
    var ds = s * 0.9, gy = feet - 5 * s;
    rectO(c, cx - 22 * ds, gy - 5 * ds, 32 * ds, 11 * ds, pal.pants);  // legs
    R(c, cx - 22 * ds, gy - 5 * ds, 32 * ds, 3 * ds, 'rgba(255,255,255,0.12)');
    R(c, cx - 22 * ds, gy + 2 * ds, 32 * ds, 4 * ds, 'rgba(0,0,0,0.3)');
    rectO(c, cx - 24 * ds, gy - 5 * ds, 8 * ds, 11 * ds, pal.boot);
    rectO(c, cx + 10 * ds, gy - 8 * ds, 18 * ds, 15 * ds, pal.jacket); // torso
    R(c, cx + 10 * ds, gy - 8 * ds, 18 * ds, 4 * ds, pal.jshade);
    R(c, cx + 10 * ds, gy + 3 * ds, 18 * ds, 4 * ds, 'rgba(0,0,0,0.28)');
    R(c, cx + 24 * ds, gy - 8 * ds, 4 * ds, 15 * ds, pal.jrim);
    var dhx = cx + 24 * ds, dhy = gy - 10 * ds;                       // head
    rectO(c, dhx, dhy, 13 * ds, 12 * ds, pal.skin);
    R(c, dhx, dhy + 8 * ds, 13 * ds, 4 * ds, pal.sksh);
    drawHeadgear(c, type, dhx, dhy, 13 * ds, 12 * ds, pal, ds);
    segO(c, cx + 12 * ds, gy, 150, 12 * ds, armW * 0.9, pal.jacket);   // sprawled arm
    seg(c, cx + 12 * ds, gy - 1 * ds, 150, 12 * ds, armW * 0.45, pal.jshade);
    fist(c, cx + 1 * ds, gy + 6 * ds, ds, pal);
    return;
  }

  var hipX = cx, hipY = feet - 29 * s + P.hip * s;
  var lean = P.lean * Math.PI / 180;
  var shX = hipX + Math.sin(lean) * 23 * s, shY = hipY - Math.cos(lean) * 23 * s;
  var tAng = -90 + P.lean;
  var pr = tAng * Math.PI / 180, ppx = -Math.sin(pr), ppy = Math.cos(pr);

  // ---- back arm (behind torso): darker, minimal rim ----
  var shB = [shX - 4 * s, shY + 1 * s];
  var elB = limb(c, shB[0], shB[1], P.aB[0], 12 * s, armW, pal.jshade, '#000000', '#3a3a44');
  var wrB = limb(c, elB[0], elB[1], P.aB[1], 10 * s, armW * 0.9, pal.sksh, '#000000', '#5a5a66');
  fist(c, wrB[0], wrB[1], s * 0.9, pal);

  // ---- back leg ----
  var hipB = [hipX - 3 * s, hipY];
  var knB = limb(c, hipB[0], hipB[1], P.lB[0], 15 * s, legW, pal.pshade, '#000000', '#2c2c3a');
  var anB = limb(c, knB[0], knB[1], P.lB[1], 13 * s, legW * 0.85, pal.pshade, '#000000', '#2c2c3a');
  boot(c, anB[0], anB[1], s * 0.95, pal);

  // ---- torso: shade back half, jacket front, rim light, hem shadow ----
  seg(c, hipX - ppx * 3 * s, hipY - ppy * 3 * s, tAng, 24 * s, torsoW * 0.62 + 4, OUTC);
  seg(c, hipX - ppx * 3 * s, hipY - ppy * 3 * s, tAng, 24 * s, torsoW * 0.62, pal.jshade);
  seg(c, hipX + ppx * 2 * s, hipY + ppy * 2 * s, tAng, 24 * s, torsoW * 0.68 + 4, OUTC);
  seg(c, hipX + ppx * 2 * s, hipY + ppy * 2 * s, tAng, 24 * s, torsoW * 0.68, pal.jacket);
  seg(c, hipX - ppx * 1 * s, hipY - ppy * 1 * s, tAng, 5 * s, torsoW * 0.7, 'rgba(0,0,0,0.30)'); // hem shadow
  seg(c, hipX + ppx * (torsoW * 0.30), hipY + ppy * (torsoW * 0.30),
      tAng, 21 * s, 2.4 * s, pal.jrim);                          // rim light, upper-right edge
  seg(c, shX - 1 * s, shY, tAng, 4 * s, torsoW * 0.5, 'rgba(255,255,255,0.18)'); // collar light

  // ---- jacket / vest / armor details per archetype ----
  if (type === 'player') { // teal jacket: collar lapels, zipper, cuffs
    seg(c, shX - ppx * 4 * s, shY - ppy * 4 * s, tAng + 24, 9 * s, 4 * s, pal.jshade);
    seg(c, shX + ppx * 4 * s, shY + ppy * 4 * s, tAng - 24, 9 * s, 4 * s, pal.jshade);
    seg(c, shX + 1 * s, shY + 2 * s, tAng, 20 * s, 2 * s, '#e8f6f4');
    R(c, shX - 6 * s, shY - 1 * s, 12 * s, 3 * s, pal.jshade);
  } else if (type === 'punk') { // open red vest: bare chest, side panels, fringe, studs
    seg(c, hipX + ppx * 1 * s, hipY + ppy * 1 * s, tAng, 24 * s, torsoW * 0.40, pal.skin);
    seg(c, hipX + ppx * 1 * s, hipY + ppy * 1 * s, tAng, 24 * s, torsoW * 0.16, pal.sksh);
    seg(c, hipX - ppx * 5 * s, hipY - ppy * 5 * s, tAng, 24 * s, torsoW * 0.30, pal.jacket);
    seg(c, hipX + ppx * 6 * s, hipY + ppy * 6 * s, tAng, 24 * s, torsoW * 0.16, pal.jacket);
    for (var fi = 0; fi < 5; fi++)                                    // fringe
      R(c, hipX - torsoW * 0.34 + fi * torsoW * 0.17, hipY - 1 * s, 2 * s, 5 * s, pal.jshade);
    for (var si = 0; si < 3; si++) {                                  // studs
      R(c, hipX - ppx * 5 * s - 1 * s, hipY - ppy * 5 * s + 4 * s + si * 6 * s, 2 * s, 2 * s, '#ffd8d0');
      R(c, hipX + ppx * 6 * s - 1 * s, hipY + ppy * 6 * s + 4 * s + si * 6 * s, 2 * s, 2 * s, '#ffd8d0');
    }
  } else { // bruiser + boss: heavy shoulder pads with rivets
    var pw = (type === 'boss' ? 19 : 13) * s;
    rectO(c, shX - pw / 2, shY - 7 * s, pw, 8 * s, pal.jshade);
    R(c, shX - pw / 2, shY - 7 * s, pw, 3 * s, pal.jacket);
    R(c, shX - pw / 2, shY - 7 * s, pw, 1.6 * s, 'rgba(255,255,255,0.25)');
    for (var ri = 0; ri < 3; ri++)
      R(c, shX - pw / 2 + 2.5 * s + ri * (pw - 5 * s) / 2, shY - 4.4 * s, 2 * s, 2 * s, pal.jrim);
  }
  if (type === 'boss') { // black lapels + gold crown chest emblem (original motif)
    seg(c, shX - ppx * 3 * s, shY - ppy * 3 * s, tAng + 20, 12 * s, 4.5 * s, '#101018');
    seg(c, shX + ppx * 3 * s, shY + ppy * 3 * s, tAng - 20, 12 * s, 4.5 * s, '#101018');
    drawCrown(c, shX - 2.5 * s, shY + 7 * s, 10 * s, 8 * s, '#ffe9a3', '#d83636');
  }

  // ---- neck + belt + buckle ----
  rectO(c, shX - 3 * s, shY - 1 * s, 6 * s, 6 * s, pal.sksh);
  rectO(c, hipX - torsoW / 2 - 1 * s, hipY - 2.5 * s, torsoW + 2 * s, 5 * s, '#101018');
  var bkw = (type === 'boss' || type === 'bruiser') ? 7 * s : 5 * s;
  rectO(c, hipX - bkw / 2 + 1 * s, hipY - 2.5 * s, bkw, 5 * s, '#c9a227');
  R(c, hipX - bkw / 2 + 1 * s, hipY - 2.5 * s, bkw, 1.6 * s, '#ffe9a3');

  // ---- front leg: thigh bulge, shin, heavy boot ----
  var hipF = [hipX + 3 * s, hipY];
  var knF = limb(c, hipF[0], hipF[1], P.lF[0], 15 * s, legW, pal.pants, pal.pshade, 'rgba(200,220,255,0.20)');
  R(c, knF[0] - 4 * s, knF[1] - 8 * s, 8 * s, 4 * s, 'rgba(255,255,255,0.10)'); // thigh light
  var anF = limb(c, knF[0], knF[1], P.lF[1], 13 * s, legW * 0.85, pal.pants, pal.pshade, 'rgba(200,220,255,0.20)');
  boot(c, anF[0], anF[1], s, pal);

  // ---- front arm: bicep bulge, forearm, heavy fist ----
  var shF = [shX + 4 * s, shY + 1 * s];
  var elF = limb(c, shF[0], shF[1], P.aF[0], 12 * s, armW, pal.jacket, pal.jshade, pal.jrim);
  var biR = P.aF[0] * Math.PI / 180;
  R(c, elF[0] - Math.cos(biR) * 6 * s - 3 * s, elF[1] - Math.sin(biR) * 6 * s - 4 * s,
     7 * s, 8 * s, 'rgba(255,255,255,0.10)');                          // bicep swell light
  var wrF = limb(c, elF[0], elF[1], P.aF[1], 10 * s, armW * 0.9, pal.skin, pal.sksh, 'rgba(255,240,200,0.30)');
  fist(c, wrF[0], wrF[1], s, pal);
  // wristband
  segO(c, elF[0], elF[1], P.aF[1], 3.4 * s, armW * 0.95,
       type === 'player' ? '#17c3b2' : type === 'punk' ? '#e6d3ae' : '#101018');

  // weapon held overhead in swing pose (heavy wooden club)
  if (pose === 'swing') {
    segO(c, wrF[0], wrF[1] - 2 * s, -25, 18 * s, 6 * s, '#8a5a2b');
    R(c, wrF[0] - 2 * s, wrF[1] - 5 * s, 6 * s, 7 * s, '#6e451f');
    R(c, wrF[0] - 2 * s, wrF[1] - 5 * s, 6 * s, 2 * s, '#a3763d');
  }

  // ---- head: heavy jaw, brow, detailed face ----
  var hx = shX + Math.sin(lean) * 6 * s + P.head[0] * s - 8 * s;
  var hy = shY - 11 * s + P.head[1] * s;
  rectO(c, hx, hy, 16 * s, 15 * s, pal.skin);
  R(c, hx, hy + 11 * s, 16 * s, 4 * s, pal.sksh);                     // jaw shade
  R(c, hx + 12 * s, hy, 4 * s, 15 * s, 'rgba(255,240,200,0.22)');      // face rim light
  R(c, hx, hy, 16 * s, 2.4 * s, 'rgba(255,255,255,0.12)');            // forehead light
  drawHeadgear(c, type, hx, hy, 16 * s, 15 * s, pal, s);
}

/* pose key selection from live fighter state */
var POSES = ['idle0', 'idle1', 'walk0', 'walk1', 'walk2', 'walk3',
  'punch_windup', 'punch_jab', 'punch_cross', 'punch_uppercut', 'punch_recover',
  'kick_chamber', 'kick_extended', 'jump', 'jumpkick', 'hit', 'down',
  'getup', 'swing', 'victory'];
function poseFor(f, isPlayer) {
  var st = f.state;
  if (st === 'down' || st === 'dead') return 'down';
  if (st === 'getup') return 'getup';
  if (st === 'hit') return 'hit';
  if (st === 'jumpkick') return 'jumpkick';
  if (st === 'jump') return 'jump';
  if (st === 'kick') return (f.stateT < 0.1) ? 'kick_chamber' : 'kick_extended';
  if (st === 'punch' || st === 'fin') {
    if (isPlayer && f.weapon) return 'swing';
    if (st === 'fin') return (f.stateT < 0.1) ? 'punch_windup' : 'punch_uppercut';
    var kind = (f.combo === 2) ? 'cross' : 'jab';
    if (f.stateT < 0.07) return 'punch_windup';
    if (f.stateT < 0.2) return kind === 'cross' ? 'punch_cross' : 'punch_jab';
    return 'punch_recover';
  }
  if (st === 'walk') return 'walk' + (Math.floor(f.walkPhase / 1.6) % 4);
  return (Math.floor(S.t * 2.4) % 2 === 0) ? 'idle0' : 'idle1';
}

/* pre-render every (type, pose) once at boot */
var SPR = {};   // SPR[type][pose] -> canvas
(function buildSprites() {
  var types = ['player', 'punk', 'bruiser', 'boss'];
  for (var ti = 0; ti < types.length; ti++) {
    var type = types[ti], s = FSCALE[type];
    SPR[type] = {};
    var cw = 72 * s + 16, ch = 64 * s + 20;   // margin for outlines + raised fists
    for (var pi = 0; pi < POSES.length; pi++) {
      var c = makeSprite(cw, ch);
      var g = c.getContext('2d');
      drawFighterArt(g, type, POSES[pi], cw, ch);
      SPR[type][POSES[pi]] = c;
    }
  }
})();

})();

/* ============================================================
   STAGE LAYERS — three original themed environments. Every layer is
   full height (216) so the camera slice (36..216) always has art.
   far (parallax 0.25) / mid (parallax 0.55) / near strip (parallax 1.0,
   full scroll length) carrying ONE big original set-piece + signature
   props + small framed cover-art wall signs only (never billboards).
   All art drawn from scratch in code.
   ============================================================ */
var SIGN_W = 30, SIGN_H = 38;   // small-sign rule: framed wall signs only
var STAGE_META = [
  { name: 'NEON ROW',    scrollLen: 900 },
  { name: 'CHROME ALLEY', scrollLen: 1000 },
  { name: 'KING\'S BLOCK', scrollLen: 900 }
];

function brickWall(c, x, y, w, h, base, mortar, bh) {
  R(c, x, y, w, h, base);
  var bwid = 16, bhgt = bh || 8;
  var rnd = srand(x * 31 + y * 57 + w);
  for (var ry = y; ry < y + h; ry += bhgt) {
    var off = ((ry / bhgt) % 2) * (bwid / 2);
    for (var rx = x - bwid; rx < x + w + bwid; rx += bwid) {
      var v = rnd();
      var col = v < 0.12 ? 'rgba(0,0,0,0.22)' : (v > 0.9 ? 'rgba(255,255,255,0.08)' : mortar);
      R(c, rx + off + 1, ry + 1, bwid - 2, bhgt - 2, col);
    }
  }
}
function damageHoles(c, rnd, x0, x1, y0, y1, n) {
  for (var i = 0; i < n; i++) {
    var hx = x0 + rnd() * (x1 - x0), hy = y0 + rnd() * (y1 - y0);
    var hw = 8 + rnd() * 22, hh = 6 + rnd() * 14;
    R(c, hx, hy, hw, hh, 'rgba(8,6,8,0.85)');
    R(c, hx - 2, hy - 2, hw + 4, 2, 'rgba(255,255,255,0.10)');
    R(c, hx + 2, hy + hh, hw - 4, 6 + rnd() * 10, 'rgba(0,0,0,0.25)'); // grime streak
  }
}
/* graffiti tag: jagged neon scrawl with dark outline, deterministic by seed */
function graffiti(g, x, y, s, col, seed) {
  var rnd = srand(seed);
  var n = 2 + Math.floor(rnd() * 2);
  for (var i = 0; i < n; i++) {
    var sx = x + i * 24 * s, sy = y + (rnd() - 0.5) * 10 * s;
    var pts = [[sx, sy]];
    for (var k = 0; k < 4; k++)
      pts.push([sx + (k + 1) * (9 + rnd() * 7) * s, sy + (rnd() - 0.5) * 24 * s]);
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = '#0a0a10'; g.lineWidth = 5.5 * s;
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (var q = 1; q < pts.length; q++) g.lineTo(pts[q][0], pts[q][1]);
    g.stroke();
    g.strokeStyle = col; g.lineWidth = 2.4 * s;
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (var q2 = 1; q2 < pts.length; q2++) g.lineTo(pts[q2][0], pts[q2][1]);
    g.stroke();
    if (rnd() < 0.6) { // drip
      R(g, pts[2][0] - 1, pts[2][1], 2.4 * s, (6 + rnd() * 10) * s, col);
    }
  }
}
/* moody vignette baked into a strip: darkens top/bottom edges (painted, not bands) */
function stripVignette(g, sw) {
  try {
    var vg = g.createLinearGradient(0, 0, 0, 216);
    vg.addColorStop(0, 'rgba(6,3,12,0.40)');
    vg.addColorStop(0.28, 'rgba(6,3,12,0)');
    vg.addColorStop(0.78, 'rgba(6,3,12,0)');
    vg.addColorStop(1, 'rgba(6,3,12,0.42)');
    g.fillStyle = vg;
    g.fillRect(0, 0, sw, 216);
  } catch (e) {} // minimal DOM stubs may lack gradients — art still fine without
}

/* small framed cover-art wall sign (the ONLY cover-art format) */
function framedSign(c, wx, wy, artKey) {
  R(c, wx, wy, SIGN_W, SIGN_H, '#241a10');                       // wooden frame
  R(c, wx + 2, wy + 2, SIGN_W - 4, SIGN_H - 4, '#c9a227');       // gold inner line
  R(c, wx + 3, wy + 3, SIGN_W - 6, SIGN_H - 6, '#0a0a12');
  var im = ART[artKey];
  var ax = wx + 4, ay = wy + 4, aw = SIGN_W - 8, ah = SIGN_H - 12;
  if (im && im.complete && im.naturalWidth) {
    try { c.drawImage(im, ax, ay, aw, ah); } catch (e) { R(c, ax, ay, aw, ah, '#22222f'); }
  } else {
    R(c, ax, ay, aw, ah, '#1d2b3a');
    c.fillStyle = '#17c3b2';
    c.font = 'bold 5px monospace'; c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(String(artKey).toUpperCase(), wx + SIGN_W / 2, ay + ah / 2 - 3);
  }
  c.fillStyle = '#c9a227';
  c.font = 'bold 5px monospace'; c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText('CWI RECORDS', wx + SIGN_W / 2, wy + SIGN_H - 8);
}
function crownSign(c, wx, wy) { // small framed crown wall decoration (same frame as framedSign)

/* animated steam vent: grate + rising puffs */
function steamVent(x, gy) {
  ctx.fillStyle = '#2c2c3a';
  ctx.fillRect(x - 14, gy - 4, 28, 8);
  for (var i = 0; i < 3; i++) ctx.fillRect(x - 10 + i * 9, gy - 4, 4, 8);
  for (var j = 0; j < 3; j++) {
    var ph = (S.t * 0.7 + j / 3) % 1;
    ctx.globalAlpha = 0.28 * (1 - ph);
    ctx.fillStyle = '#b8b8c8';
    ctx.beginPath();
    ctx.arc(x - 8 + j * 8, gy - 8 - ph * 44, 4 + ph * 7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

    R(g, 100, 116, 72, 8, '#26503a');
    R(g, 104, 130, 64, 3, '#142a1e'); R(g, 104, 142, 64, 3, '#142a1e');
    R(g, 640, 56, 26, 96, '#3a3a48');                                // ladder (flavor)
    for (var ly = 62; ly < 148; ly += 12) R(g, 642, ly, 22, 4, '#55555f');
    [300, 580].forEach(function (ax) {                               // striped awnings
      for (var s2 = 0; s2 < 8; s2++) R(g, ax + s2 * 12, 96, 12, 26, s2 % 2 ? '#7a2430' : '#d8d0c0');
      R(g, ax, 96, 96, 4, '#3a3a48');
      R(g, ax, 122, 96, 3, 'rgba(0,0,0,0.3)');
    });
    // concrete ground
    R(g, 0, 136, sw, 80, '#181820');
    R(g, 0, 136, sw, 4, '#232330');
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.ellipse(420, 184, 42, 8, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(830, 174, 26, 6, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(150, 196, 30, 7, 0, 0, Math.PI * 2); g.fill();
    R(g, 540, 180, 42, 10, '#101018');                               // drain grate
    for (var gx2 = 542; gx2 < 580; gx2 += 6) R(g, gx2, 181, 3, 8, '#23232e');
    g.strokeStyle = '#0e0e14'; g.lineWidth = 1;
    for (var cx1 = 90; cx1 < sw; cx1 += 200) {
      g.beginPath(); g.moveTo(cx1, 150); g.lineTo(cx1 + 30, 172); g.lineTo(cx1 + 12, 200); g.stroke();
    }
    // neon puddle reflections on the wet concrete
    g.fillStyle = 'rgba(255,95,162,0.10)';
    g.beginPath(); g.ellipse(300, 190, 40, 6, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(23,195,178,0.10)';
    g.beginPath(); g.ellipse(700, 197, 34, 5, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,210,63,0.08)';
    g.beginPath(); g.ellipse(950, 186, 30, 5, 0, 0, Math.PI * 2); g.fill();
    stripVignette(g, sw);
  } else {
    // club interior: deep purple walls, wood floor (mid speaker stacks read above)
    R(g, 0, 84, sw, 44, '#33143a');
    R(g, 0, 84, sw, 2, '#8a6f1e');
    R(g, 0, 124, sw, 4, '#1c0a20');
    for (var vx = 0; vx < sw; vx += 72) R(g, vx, 88, 3, 36, '#241028'); // panel seams
    R(g, 0, 30, sw, 8, '#160818');                                   // ceiling trim
    for (var k = 0; k < bbs.length; k++) framedSign(g, bbs[k].x, 86, bbs[k].art);
    cwiWallSign(g, 300, 88, 44);
    stageRig(g, 520);
    R(g, 320, 92, 4, 62, '#3a3a48');                                // mic stand
    R(g, 314, 86, 16, 6, '#3a3a48');
    R(g, 318, 84, 8, 4, '#55555f');
    g.strokeStyle = '#101018'; g.lineWidth = 3;                      // cables
    g.beginPath(); g.moveTo(200, 202); g.quadraticCurveTo(400, 192, 640, 206); g.stroke();
    g.beginPath(); g.moveTo(240, 208); g.quadraticCurveTo(460, 216, 700, 202); g.stroke();
    R(g, 180, 120, 46, 42, '#101018');                              // side cab
    R(g, 180, 120, 46, 4, '#1c1c28');
    g.fillStyle = '#0a0a10';
    g.beginPath(); g.arc(203, 141, 12, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2c2c3a';
    g.beginPath(); g.arc(203, 141, 5, 0, Math.PI * 2); g.fill();
    // wood floor
    R(g, 0, 128, sw, 88, '#2c1a2e');
    for (var fx = 0; fx < sw; fx += 48) R(g, fx, 128, 2, 88, '#1a0c1c');
    R(g, 0, 128, sw, 5, 'rgba(201,162,39,0.22)');
    for (var fz = 140; fz < 216; fz += 24) R(g, 0, fz, sw, 1, 'rgba(0,0,0,0.25)');
    R(g, 0, 84, sw, 16, 'rgba(10,3,14,0.35)');                        // top grime shade
    stripVignette(g, sw);
  }
  return c;
}

var FAR = [], MID = [], NEAR = [];
(function buildStages() {
  for (var i = 0; i < 3; i++) {
    FAR.push(farTile(i));
    MID.push(midTile(i));
    NEAR.push(nearStrip(i, S.stages[i]));
  }
})();

/* parallax tile draw: layer moves at `factor` x camera speed (world coords) */
function paraDraw(layer, factor) {
  var off = CAM.x * (1 - factor);
  var startX = Math.floor((CAM.x - 480) / 480) * 480;
  var endX = CAM.x + CAM.viewW + 480;
  for (var x = startX; x < endX; x += 480) {
    try { ctx.drawImage(layer, x + off, 0); } catch (e) {}
  }
}

/* dynamic animated overlays per stage, world coords (cheap: a few shapes) */
function drawStageFx() {
  var idx = S.stageIdx;
  if (idx === 0) {
    var tx = 850;                                                    // traffic light
    ctx.fillStyle = '#2c2c3a';
    ctx.fillRect(tx, 84, 8, 66);
    ctx.fillStyle = '#101018';
    ctx.fillRect(tx - 4, 58, 16, 28);
    var phase = Math.floor(S.t * 0.8) % 3;
    ctx.fillStyle = phase === 0 ? '#ff5252' : '#3a1518';
    ctx.fillRect(tx - 1, 61, 10, 6);
    ctx.fillStyle = phase === 1 ? '#ffd23f' : '#3a3015';
    ctx.fillRect(tx - 1, 70, 10, 6);
    ctx.fillStyle = phase === 2 ? '#41d83f' : '#153a18';
    ctx.fillRect(tx - 1, 79, 10, 6);
    steamVent(350, 150);
  } else if (idx === 1) {
    var flick = (Math.floor(S.t * 9) % 7 === 0) ? 0.55 : 1;          // neon flicker
    ctx.save();
    ctx.globalAlpha = 0.95 * flick;
    ctx.fillStyle = '#ff5fa2';
    ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('CWI', 413, 46);
    ctx.strokeStyle = '#ff5fa2'; ctx.lineWidth = 1.5;
    ctx.strokeRect(382.5, 42.5, 61, 23);
    ctx.restore();
    steamVent(650, 154);
  } else {
    var rx = 580, rx2 = 700;                                         // sweeping beams
    ctx.save();
    ctx.globalAlpha = 0.13;
    [[rx, '#ff5fa2', 0], [rx2, '#41d8e8', 2.4]].forEach(function (bm) {
      var sway = Math.sin(S.t * 1.4 + bm[2]) * 70;
      ctx.fillStyle = bm[1];
      ctx.beginPath();
      ctx.moveTo(bm[0], 44);
      ctx.lineTo(bm[0] + sway - 34, 216);
      ctx.lineTo(bm[0] + sway + 34, 216);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
    for (var hx = 120; hx < 1100; hx += 260) {                        // hanging lamps
      ctx.fillStyle = '#160818';
      ctx.fillRect(hx, 30, 4, 20);
      var pulse = 0.5 + 0.5 * Math.sin(S.t * 3 + hx);
      ctx.fillStyle = 'rgba(255,233,163,' + (0.55 + 0.3 * pulse).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(hx + 2, 56, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,233,163,' + (0.16 + 0.08 * pulse).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(hx + 2, 56, 13, 0, Math.PI * 2); ctx.fill();
    }
    for (var px = 200; px < 1100; px += 240) {                        // floor spot pools
      var pulse2 = 0.5 + 0.5 * Math.sin(S.t * 2 + px);
      ctx.fillStyle = 'rgba(255,210,63,' + (0.10 + 0.05 * pulse2).toFixed(2) + ')';
      ctx.beginPath(); ctx.ellipse(px, 200, 46, 8, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}

/* ---------- fighters in world space ---------- */
function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(x, y + 1, w, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
}
function drawFighter(f, type, isPlayer) {
  if (f.dead && f.deathT > 2.5) return;
  var pose = poseFor(f, isPlayer);
  var img = SPR[type][pose];
  var w = img.width, h = img.height;
  var x = f.x, y = f.y - f.z - h;
  var blink = (f.iframes > 0 && Math.floor(S.t * 18) % 2 === 0);
  drawShadow(x, f.y, w * 0.32);
  if (type === 'boss') { // separation backdrop: dim the wall behind Big Chrome
    ctx.fillStyle = 'rgba(8,4,12,0.45)';
    ctx.beginPath(); ctx.ellipse(x, y + h * 0.45, w * 0.75, h * 0.52, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save();
  if (f.facing < 0) { ctx.translate(x, 0); ctx.scale(-1, 1); ctx.drawImage(img, -w / 2, y, w, h); }
  else ctx.drawImage(img, x - w / 2, y, w, h);
  if (blink) { // hurt blink: darken via overlay
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - w / 2, y, w, h);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (!isPlayer && f.hp < f.maxHp && f.state !== 'dead' && f.state !== 'down') {
    // hp pips
    var n = Math.ceil(f.maxHp / 8), cur = Math.ceil(f.hp / 8);
    var bx = x - n * 3;
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = i < cur ? '#41d83f' : '#3a1518';
      ctx.fillRect(bx + i * 6, y - 8, 5, 3);
    }
  }
  if (type === 'boss' && f.state !== 'dead') {
    ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText('BIG CHROME', x + 1, y - 19);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('BIG CHROME', x, y - 20);
  }
}
function drawWeaponPickup(wp) {
  drawShadow(wp.x, wp.y, 12);
  ctx.save();
  ctx.translate(wp.x, wp.y - 6);
  ctx.rotate(-0.5);
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(-13, -2.5, 26, 5);
  ctx.fillStyle = '#6e451f';
  ctx.fillRect(-13, 0, 26, 2.5);
  ctx.restore();
}

/* ---------- full-bleed background under the camera ---------- */
function drawBackground() {
  paraDraw(FAR[S.stageIdx], 0.25);
  paraDraw(MID[S.stageIdx], 0.55);
  try { ctx.drawImage(NEAR[S.stageIdx], 0, 0); } catch (e) {}
  drawStageFx();
}

/* ---------- particles (world coords, additive-ish via alpha) ---------- */
function drawParticles() {
  for (var i = 0; i < S.particles.length; i++) {
    var p = S.particles[i];
    var a = 1 - p.t / p.life;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.color;
    var sz = p.size || 3;
    ctx.fillRect(p.x - sz / 2, p.y - p.z - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
  for (var j = 0; j < vdust.length; j++) {
    var d = vdust[j];
    ctx.globalAlpha = 0.35 * (1 - d.t / d.life);
    ctx.fillStyle = '#b8b0a0';
    ctx.fillRect(d.x - 3, d.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;
}

/* ---------- arcade HUD: named portrait + bars, text directly on the art ---------- */
function drawPortraitBox(g, x, y, type, size) {
  g.fillStyle = '#0a0a12';
  g.fillRect(x, y, size, size);
  try { g.drawImage(PORTRAIT[type], x + 2, y + 2, size - 4, size - 4); } catch (e) {}
  g.strokeStyle = '#c9a227';
  g.lineWidth = Math.max(1, size / 18);
  g.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
}
function segBar(x, y, w, h, frac, color) {
  ctx.fillStyle = '#101018';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  var segs = 12, sw = w / segs;
  for (var i = 0; i < segs; i++) {
    ctx.fillStyle = (i / segs) < frac ? color : '#3a2028';
    ctx.fillRect(x + i * sw + 0.5, y, sw - 1, h);
  }
}
function drawHUD() {
  var p = S.player;
  screenTransform();
  var hs = CAM.ch / 216, hw = CAM.cw / hs;
  ctx.save();
  ctx.scale(hs, hs);
  ctx.lineWidth = 1;
  var compact = hw < 170;
  if (!compact) {
    drawPortraitBox(ctx, 6, 5, 'player', 26);
    htxt('REY', 38, 3, 11, '#fff');
    var hpf = Math.max(0, p.hp / p.maxHp);
    segBar(38, 17, 110, 11, hpf, hpf > 0.5 ? '#41d83f' : hpf > 0.25 ? '#ffd23f' : '#ff5252');
    htxt('SCORE ' + String(S.score).padStart(6, '0'), 6, 36, 10, '#ffd23f');
    htxt('TIME ' + Math.ceil(stageClock), hw / 2, 4, 13, '#ffd23f', 'center');
    htxt('STG ' + (S.stageIdx + 1) + ' ' + STAGE_META[S.stageIdx].name, hw / 2, 21, 8, '#17c3b2', 'center');
    htxt('LIVES ' + S.lives, hw - 6, 4, 11, '#ff6b8a', 'right');
    htxt('CREDIT 00', hw - 6, 21, 8, '#ffd23f', 'right');
  } else {
    // compact portrait HUD for narrow screens: two rows, nothing clipped
    drawPortraitBox(ctx, 4, 3, 'player', 20);
    htxt('REY', 28, 1, 9, '#fff');
    var hpf2 = Math.max(0, p.hp / p.maxHp);
    segBar(28, 13, 58, 8, hpf2, hpf2 > 0.5 ? '#41d83f' : hpf2 > 0.25 ? '#ffd23f' : '#ff5252');
    htxt('TIME ' + Math.ceil(stageClock), hw - 4, 2, 11, '#ffd23f', 'right');
    fitTxt('SCORE ' + String(S.score).padStart(6, '0'), 4, 27, 8, '#ffd23f', 'left', hw * 0.42);
    fitTxt('S' + (S.stageIdx + 1), hw / 2, 27, 8, '#17c3b2', 'center', hw * 0.16);
    fitTxt('LIVES ' + S.lives, hw - 4, 27, 8, '#ff6b8a', 'right', hw * 0.32);
    htxt('CREDIT 00', hw - 4, 38, 7, '#ffd23f', 'right');
  }
  // boss bar
  if (S.boss && !S.boss.dead) {
    var bw = Math.min(hw - 20, 170);
    var bx0 = hw / 2 - bw / 2, by0 = 216 - 22;
    drawPortraitBox(ctx, bx0 - 2, by0 - 14, 'boss', 16);
    htxt('BIG CHROME', hw / 2, by0 - 13, 9, '#ffd23f', 'center');
    segBar(bx0, by0, bw, 9, Math.max(0, S.boss.hp / S.boss.maxHp), '#d83636');
  }
  // combo
  if (p.combo >= 2 && p.state !== 'idle') {
    htxt(p.combo + ' HITS!', hw - 8, 46, 11, '#ff9a3f', 'right');
  }
  // message banner
  if (S.msgT > 0) {
    ctx.globalAlpha = Math.min(1, S.msgT * 2);
    goldTxt(S.msg, hw / 2, 64, 15, 'center');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------- gold marquee title card (reused on title + end screens) ---------- */
function drawMarqueeTitle(cx, cy, scale) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  drawCrown(ctx, -30, -46, 60, 30, '#c9a227', '#d83636');
  goldTxt('STREET', 0, -12, 26, 'center');
  goldTxt('KINGS', 0, 16, 26, 'center');
  ctx.restore();
}

/* ---------- title screen: art fills the canvas, marquee + heroes on top ---------- */
function drawTitle() {
  updateCamera();
  worldTransform();
  paraDraw(FAR[0], 0.25);
  paraDraw(MID[0], 0.55);
  try { ctx.drawImage(NEAR[0], 0, 0); } catch (e) {}
  screenTransform();
  ctx.fillStyle = 'rgba(5,5,12,0.55)';
  ctx.fillRect(0, 0, CAM.cw, CAM.ch);
  var hs = CAM.ch / 216, hw = CAM.cw / hs;
  ctx.save();
  ctx.scale(hs, hs);
  // small CWI logo chip + wordmark
  drawArtLogo(ctx, 6, 4, 12);
  fitTxt('CUMULATIVE WEB INC', 22, 4, 7, '#c9a227', 'left', hw - 30);
  drawMarqueeTitle(hw / 2, 58, hw < 170 ? 0.85 : 1.2);
  // hero vs boss flanking the marquee
  var hero = SPR.player.victory, boss = SPR.boss.victory;
  var hh = hw < 170 ? 44 : 58, bh = hw < 170 ? 56 : 72;
  var hyb = 158;   // fighters' feet baseline
  try {
    ctx.drawImage(hero, hw * 0.08, hyb - hh, hh * hero.width / hero.height, hh);
    ctx.drawImage(boss, hw * 0.92 - bh * boss.width / boss.height, hyb - bh,
                  bh * boss.width / boss.height, bh);
  } catch (e) {}
  fitTxt('The King\'s Block has fallen to Big Chrome\'s crew.', hw / 2, 166, 7, '#fff', 'center', hw - 12);
  fitTxt('Rey hits the Neon Row to take it back.', hw / 2, 176, 7, '#fff', 'center', hw - 12);
  if (Math.floor(S.t * 2) % 2 === 0) goldTxt('TAP TO START', hw / 2, 188, hw < 170 ? 9 : 12, 'center');
  fitTxt('ARROWS/WASD MOVE · J PUNCH · K KICK · SPACE JUMP', hw / 2, 202, 6, '#8a8a92', 'center', hw - 8);
  fitTxt('© CUMULATIVE WEB INC — AN ORIGINAL BEAT-\'EM-UP', hw / 2, 210, 6, '#5a5a66', 'center', hw - 8);
  ctx.restore();
}

/* ---------- end screens ---------- */
function drawEnd(win) {
  updateCamera();
  worldTransform();
  drawBackground();
  if (win) {
    var hero2 = SPR.player.victory;
    var hw2 = 72;
    try { ctx.drawImage(hero2, S.player.x - hw2 / 2, S.player.y - hero2.height, hw2, hero2.height); } catch (e) {}
  }
  screenTransform();
  ctx.fillStyle = win ? 'rgba(5,20,12,0.55)' : 'rgba(20,5,8,0.65)';
  ctx.fillRect(0, 0, CAM.cw, CAM.ch);
  var hs = CAM.ch / 216, hw = CAM.cw / hs;
  ctx.save();
  ctx.scale(hs, hs);
  drawMarqueeTitle(hw / 2, 52, 0.9);
  if (win) {
    goldTxt('CITY RECLAIMED!', hw / 2, 92, 16, 'center');
    htxt('FINAL SCORE ' + String(S.score).padStart(6, '0'), hw / 2, 118, 10, '#ffd23f', 'center');
    htxt('The Block is yours, King.', hw / 2, 132, 8, '#fff', 'center');
  } else {
    goldTxt('GAME OVER', hw / 2, 92, 18, 'center');
    htxt('SCORE ' + String(S.score).padStart(6, '0'), hw / 2, 118, 10, '#ffd23f', 'center');
    htxt('The Block still needs its King.', hw / 2, 132, 8, '#fff', 'center');
  }
  if (Math.floor(S.t * 2) % 2 === 0) goldTxt('TAP TO RETRY', hw / 2, 158, 11, 'center');
  ctx.restore();
}

/* ============================================================
   RENDER — full-bleed camera frame. No letterbox anywhere: every
   screen paints the stage (or title art) across the whole canvas
   first, then HUD/text on top. No per-frame allocations.
   ============================================================ */
function render() {
  updateCamera();
  ctx.save();
  if (S.screen === 'title') {
    drawTitle();
  } else if (S.screen === 'gameover') {
    drawEnd(false);
  } else if (S.screen === 'victory') {
    drawEnd(true);
  } else {
    worldTransform();
    drawBackground();
    // depth-sorted draws: weapons, fighters, particles
    var i, draws = [];
    for (i = 0; i < S.weapons.length; i++) draws.push({ y: S.weapons[i].y, k: 0, o: S.weapons[i] });
    draws.push({ y: S.player.y, k: 1, o: S.player });
    for (i = 0; i < S.enemies.length; i++) draws.push({ y: S.enemies[i].y, k: 2, o: S.enemies[i] });
    draws.sort(function (a, b) { return a.y - b.y; });
    for (i = 0; i < draws.length; i++) {
      var d = draws[i];
      if (d.k === 0) drawWeaponPickup(d.o);
      else if (d.k === 1) drawFighter(d.o, 'player', true);
      else drawFighter(d.o, d.o.type, false);
    }
    drawParticles();
    drawHUD();
    if (S.paused) {
      screenTransform();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, CAM.cw, CAM.ch);
      var hs2 = CAM.ch / 216, hw2 = CAM.cw / hs2;
      ctx.save();
      ctx.scale(hs2, hs2);
      goldTxt('PAUSED', hw2 / 2, 96, 18, 'center');
      htxt('P / TAP PAUSE TO RESUME', hw2 / 2, 122, 8, '#fff', 'center');
      ctx.restore();
    }
  }
  ctx.restore();
}

/* ---------------- config surface (tests + harnesses) ---------------- */
var __CFG = {
  fighterFrac: CAM.fighterFrac,
  signW: SIGN_W,
  poses: POSES.length,
  spriteFrames: SPRITE_COUNT,
  particleCap: 160,
  stages: STAGE_META.map(function (s) { return s.name; })
};
if (typeof global !== 'undefined') {
  global.__CFG = __CFG;
  global.__SPR = SPR;
  global.__drawFighterArt = drawFighterArt;
  global.__fitCanvas = fitCanvas;
  global.__CAM = { x: CAM.x, y: CAM.y, viewW: CAM.viewW, viewH: CAM.viewH,
                   scale: CAM.scale, cw: CAM.cw, ch: CAM.ch,
                   fighterFrac: CAM.fighterFrac };
}

/* ---------------- boot ---------------- */
fitCanvas();
try { ctx.imageSmoothingEnabled = false; } catch (e) {}
if (typeof window.addEventListener !== 'undefined') {
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', function () {
    setTimeout(fitCanvas, 120);
    setTimeout(fitCanvas, 600);
  });
}
queueFrame();

})();

</script>
