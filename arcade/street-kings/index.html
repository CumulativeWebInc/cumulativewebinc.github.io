<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }

  body { display:flex; align-items:center; justify-content:center; font-family:monospace; color:#fff; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px; width:100%; max-width:860px; }
  #game { image-rendering:pixelated; image-rendering:crisp-edges; background:#0a0a12;

  #actions { display:flex; gap:10px; }
  .tbtn { user-select:none; -webkit-user-select:none; touch-action:none;
          background:#1a1a26; border:2px solid #17c3b2; color:#17c3b2; border-radius:12px;
          font-family:monospace; font-size:18px; font-weight:bold; text-align:center;
          display:flex; align-items:center; justify-content:center; cursor:pointer; min-height:44px; }
  .tbtn:active { background:#17c3b2; color:#0a0a12; }
  #dpad .tbtn { font-size:20px; }
  .abtn { width:84px; height:76px; font-size:15px; }
  #btn-punch { border-color:#ff6b8a; color:#ff6b8a; }
  #btn-punch:active { background:#ff6b8a; color:#0a0a12; }
  #btn-kick { border-color:#ffd23f; color:#ffd23f; }
  #btn-kick:active { background:#ffd23f; color:#0a0a12; }
  #btn-jump { border-color:#7b3fd4; color:#c9a9f5; }
  #btn-jump:active { background:#7b3fd4; color:#0a0a12; }
  #btn-pause { position:fixed; top:10px; right:10px; z-index:50; width:44px; height:44px;
          background:#1a1a26; border:2px solid #ffd23f; color:#ffd23f; border-radius:10px;
          font-size:18px; display:flex; align-items:center; justify-content:center; }
  #hint { font-size:10px; color:#666; text-align:center; line-height:1.5; user-select:none; -webkit-user-select:none; }
</style>

/* ===== logic.js (pure game core, zero DOM) ===== */
/* ============================================================
   STREET KINGS — pure game logic core (no DOM, no audio, no window)
   Original side-scrolling beat-'em-up. Clean-room genre mechanics:
   walk / punch / kick / jump / combos / weapons / waves / boss.
   IP-CLEAN: genre-inspired only. Original title, fighters, story, gangs,
   art, music, SFX — nothing borrowed from any existing game.
   Usable from node (tests) and browser (game) alike.
   ============================================================ */
var SK = (function () {
'use strict';

/* ---------------- utils ---------------- */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function sgn(v) { return v < 0 ? -1 : 1; }

/* ---------------- constants ---------------- */
var W = 384, H = 216;
var Y_MIN = 128, Y_MAX = 196;   // walkable depth band
var GRAV = 1500;                // jump gravity px/s^2
var JUMP_V = 520;               // jump velocity -> apex ~90px
var WALK = 110;                 // player px/s
var EXTRA_LIFE_AT = 15000;

var P_HP = 100;
var PUNCH = { dmg: 8,  range: 28, startup: 0.07, active: 0.13, recover: 0.16 };
var KICK  = { dmg: 12, range: 34, startup: 0.10, active: 0.14, recover: 0.22 };
var FIN   = { dmg: 16, range: 34, startup: 0.10, active: 0.14, recover: 0.26 }; // 3rd-hit finisher

var WEAPONS = {
  bat:    { dmg: 18, range: 42, uses: 3, label: 'BAT' },

};

    weapons: [],               // ground pickups {kind,x,y,uses}
    enemies: [],

function resetPlayer(S, full) {

    hp: P_HP, maxHp: P_HP,
    facing: 1, state: 'idle', stateT: 0,
    combo: 0, comboT: 0,
    weapon: null,              // {kind, uses}

  S.score = 0; S.lives = 3; S.extraLifeGiven = false;

/* ---------------- helpers ---------------- */
function curStage(S) { return S.stages[S.stageIdx]; }

}
function spark(S, x, y, z, color, n) {

      x: x + (S.rng() - 0.5) * 10, y: y - 14 + (S.rng() - 0.5) * 14, z: z + S.rng() * 8,
      vx: (S.rng() - 0.5) * 160, vy: (S.rng() - 0.5) * 60, vz: S.rng() * 120,

}

/* ---------------- enemies ---------------- */
function spawnEnemy(S, type, wx, wy) {

    hp: T.hp, maxHp: T.hp, speed: T.speed, dmg: T.dmg, atkCdMax: T.cd,
    score: T.score, w: T.w, h: T.h,
    facing: -1, state: 'spawn', stateT: 0, atkCd: 0.4 + S.rng() * 0.8,
    hitDone: false, iframes: 0, walkPhase: S.rng() * 6, dead: false, deathT: 0,
    strafe: (S.rng() - 0.5) * 40

  return e;
}

function spawnWave(S, wave) {
  var cx = S.scrollX + W / 2;
  for (var i = 0; i < wave.comp.length; i++) {
    var side = (i % 2 === 0) ? 1 : -1;
    var wx = side > 0 ? S.scrollX + W + 24 + i * 26 : S.scrollX - 24 - i * 26;
    var wy = Y_MIN + 12 + S.rng() * (Y_MAX - Y_MIN - 24);
    spawnEnemy(S, wave.comp[i], wx, wy);
  }
  sfx(S, 'wave');
}

function hurtEnemy(S, e, dmg, dir, knockdown) {
  if (e.iframes > 0 || e.state === 'dead') return;
  e.hp -= dmg;
  e.facing = sgn(-dir) || 1;
  spark(S, e.x, e.y, e.z + 10, '#ffd23f', 5);
  if (e.hp <= 0) {
    e.hp = 0; e.state = 'dead'; e.deathT = 0; e.z = Math.max(e.z, 0);
    sfx(S, e.type === 'boss' ? 'bossko' : 'ko');
    spark(S, e.x, e.y, e.z + 10, '#ff5252', 10);
    addScore(S, e.score);

    if (e.type === 'bruiser' && S.rng() < 0.5) {
      S.weapons.push({ kind: 'bat', x: e.x, y: e.y, uses: WEAPONS.bat.uses });
    }
    if (e === S.boss) S.boss = null;

  sfx(S, 'hit');

    e.state = 'down'; e.stateT = 0; e.vz = 160; // pop up, gravity slams down

}

function enemyStrike(S, e) {
  var p = S.player;
  if (p.iframes > 0 || p.state === 'down' || p.state === 'dead') return;
  var range = e.type === 'boss' ? 34 : 28;
  if (inRange(e.x, e.y, e.z, p.x, p.y, p.z, range, 12, 18)) {
    hurtPlayer(S, e.dmg, sgn(p.x - e.x) || 1, e.type === 'boss');
  }
}

function hurtPlayer(S, dmg, dir, heavy) {
  var p = S.player;
  if (p.iframes > 0 || p.state === 'down' || p.state === 'dead' || S.screen !== 'play') return;
  p.hp -= dmg;
  spark(S, p.x, p.y, p.z + 12, '#ff5252', 6);
  sfx(S, 'phit');
  S.shake = 0.18;
  if (p.weapon && (heavy || p.hp <= 0)) { // drop weapon on knockdown
    S.weapons.push({ kind: p.weapon.kind, x: p.x, y: clamp(p.y, Y_MIN, Y_MAX), uses: p.weapon.uses });
    p.weapon = null;
  }
  if (p.hp <= 0) {
    p.hp = 0;
    p.state = 'down'; p.stateT = 0; p.vz = 200; p.downT = 1.4; // long knockdown = death check at land
    sfx(S, 'pdown');
    return;
  }
  if (heavy) { p.state = 'down'; p.stateT = 0; p.vz = 170; p.downT = 0.9; sfx(S, 'pdown'); }
  else { p.state = 'hit'; p.stateT = 0; }

}

function updateEnemy(S, e, dt) {
  var p = S.player;
  e.stateT += dt;
  if (e.iframes > 0) e.iframes -= dt;
  if (e.atkCd > 0) e.atkCd -= dt;

  // gravity for pop-up knockdowns
  if (e.z > 0 || e.vz !== 0) {
    e.vz -= GRAV * dt; e.z += e.vz * dt;
    if (e.z <= 0) { e.z = 0; e.vz = 0; }
  }

  switch (e.state) {
    case 'spawn':

      break;

      e.facing = sgn(dx) || e.facing;

      } else {
        var sp = e.speed;
        if (adx > 24) e.x += sgn(dx) * sp * dt;
        if (ady > 7) e.y += sgn(dy) * sp * 0.72 * dt;
        e.walkPhase += dt * 10;
      }
      e.x = clamp(e.x, S.scrollX - 60, S.scrollX + W + 60);
      e.y = clamp(e.y, Y_MIN, Y_MAX);

    case 'attack': {

      var windup = e.type === 'boss' ? 0.4 : 0.32;
      e.facing = sgn(p.x - e.x) || e.facing;
      if (!e.hitDone && e.stateT >= windup) { e.hitDone = true; enemyStrike(S, e); sfx(S, 'eswing'); }
      if (e.stateT > windup + 0.25) { e.state = 'walk'; e.stateT = 0; e.atkCd = T.cd * (0.85 + S.rng() * 0.3); }

    case 'hit':

      break;
    case 'down':
      if (e.z === 0 && e.stateT > 0.85) { e.state = 'getup'; e.stateT = 0; e.iframes = 0.8; }
      break;
    case 'getup':
      if (e.stateT > 0.4) { e.state = 'walk'; e.stateT = 0; }
      break;

}

function updatePlayer(S, inp, dt) {

  if (p.comboT > 0) { p.comboT -= dt; if (p.comboT <= 0) p.combo = 0; }

    }
  }

  var st = curStage(S);
  var attacking = (p.state === 'punch' || p.state === 'kick' || p.state === 'fin' || p.state === 'jumpkick');

  switch (p.state) {
    case 'idle':

      sfx(S, 'clear');
      if (S.waveIdx >= st.waves.length) stageClear(S);

    return;

    sfx(S, 'victory');
    return;
  }

  S.enemies = []; S.weapons = []; S.boss = null;

  p.state = 'idle'; p.stateT = 0; p.weapon = null; p.iframes = 1.5;

  var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
  var g = AC.createGain(); g.gain.setValueAtTime(vol || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);
}
function sfxPlay(n) {
  switch (n) {
    case 'pswing': case 'eswing': noise(0.08, 0.25, 2500); break;
    case 'jumpswing': noise(0.1, 0.3, 3000); tone(300, 600, 0.1, 'square', 0.2); break;
    case 'whiff': noise(0.06, 0.15, 4000); break;
    case 'hit': case 'phit': noise(0.09, 0.5, 900); tone(160, 70, 0.09, 'triangle', 0.5); break;
    case 'ko': tone(320, 50, 0.4, 'sawtooth', 0.5); noise(0.25, 0.4, 700); break;
    case 'pdown': tone(240, 45, 0.5, 'sawtooth', 0.5); noise(0.3, 0.4, 600); break;
    case 'pdead': tone(400, 40, 0.9, 'sawtooth', 0.5); break;
    case 'jump': tone(220, 520, 0.14, 'square', 0.25); break;
    case 'pickup': tone(660, 880, 0.09, 'square', 0.3); break;
    case 'break': noise(0.18, 0.5, 1800); break;
    case 'wave': tone(140, 140, 0.25, 'sawtooth', 0.35); tone(140, 140, 0.25, 'sawtooth', 0.35, 0.3); break;
    case 'clear': tone(523, 523, 0.12, 'square', 0.3); tone(659, 659, 0.12, 'square', 0.3, 0.12); tone(784, 784, 0.2, 'square', 0.3, 0.24); break;
    case 'stageclear': [523, 659, 784, 1047].forEach(function (f, i) { tone(f, f, 0.15, 'square', 0.3, i * 0.13); }); break;
    case 'victory': [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, f, 0.2, 'square', 0.32, i * 0.15); }); break;
    case 'boss': tone(98, 98, 0.4, 'sawtooth', 0.5); tone(98, 98, 0.4, 'sawtooth', 0.5, 0.45); break;
    case 'bossko': tone(200, 30, 0.8, 'sawtooth', 0.55); noise(0.5, 0.5, 500); break;
    case 'start': [392, 523, 659].forEach(function (f, i) { tone(f, f, 0.12, 'square', 0.3, i * 0.1); }); break;
    case 'extralife': [784, 988, 1175, 1568].forEach(function (f, i) { tone(f, f, 0.12, 'square', 0.3, i * 0.09); }); break;
  }
}

/* ---------------- input ---------------- */
var input = { left: false, right: false, up: false, down: false, punch: false, kick: false, jump: false, start: false };
var tapStart = false; // canvas tap -> start (title/gameover/victory)

var KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  KeyJ: 'punch', KeyZ: 'punch',
  KeyK: 'kick', KeyX: 'kick',
  KeyL: 'jump', KeyC: 'jump', Space: 'jump',
  Enter: 'start'
};
function onKey(e, down) {
  var k = KEYMAP[e.code];
  if (k) { input[k] = down; if (e.cancelable) e.preventDefault(); audio(); }
  else if (e.code === 'KeyP' && down) { togglePause(); }
  else if (e.code === 'KeyM' && down) { muted = !muted; }
}
if (typeof window.addEventListener !== 'undefined') {
  window.addEventListener('keydown', function (e) { onKey(e, true); });
  window.addEventListener('keyup', function (e) { onKey(e, false); });
}

function bindHold(id, name) {
  var el = document.getElementById(id);
  if (!el) return;
  var on = function (e) { if (e.cancelable) e.preventDefault(); input[name] = true; audio(); };
  var off = function (e) { if (e.cancelable) e.preventDefault(); input[name] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
bindHold('btn-left', 'left'); bindHold('btn-right', 'right');
bindHold('btn-up', 'up'); bindHold('btn-down', 'down');
bindHold('btn-punch', 'punch'); bindHold('btn-kick', 'kick'); bindHold('btn-jump', 'jump');

var pauseBtn = document.getElementById('btn-pause');
if (pauseBtn) pauseBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); togglePause(); audio(); });
function togglePause() {
  if (S.screen === 'play') { S.paused = !S.paused; sfxPlay('pickup'); }
}
if (cv.addEventListener) {
  cv.addEventListener('pointerdown', function (e) {
    if (e.cancelable) e.preventDefault();
    audio();
    if (S.screen !== 'play') tapStart = true;
  });
}

/* ---------------- game state ---------------- */
var S = SK.newGame(20260927);
var acc = 0, lastT = 0;
var STEP = 1 / 60;

function frame(tms) {
  var t = tms / 1000;
  if (!lastT) lastT = t;
  var dt = Math.min(t - lastT, 0.1);
  lastT = t;
  acc += dt;
  var n = 0;
  while (acc >= STEP && n < 5) {
    var snap = {
      left: input.left, right: input.right, up: input.up, down: input.down,
      punch: input.punch, kick: input.kick, jump: input.jump,
      start: input.start || tapStart
    };
    SK.update(S, snap, STEP);
    var q = SK.drainSfx(S);
    for (var i = 0; i < q.length; i++) sfxPlay(q[i]);
    tapStart = false;
    acc -= STEP; n++;
  }
  if (n === 5) acc = 0;
  render();
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
}

/* ---------------- drawing helpers ---------------- */
function rr(x, y, w, h, r) { // rounded rect path
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, size, color, align) {
  ctx.font = 'bold ' + size + 'px monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = color || '#fff';
  ctx.fillText(s, x, y);
}

/* Fighter palettes: [jacket, pants, skin, hair] — original characters */
var PAL = {
  player:  ['#17c3b2', '#223344', '#e8b88a', '#14141c'],
  punk:    ['#d83636', '#2a2a33', '#e8b88a', '#5a2d0c'],
  bruiser: ['#7b3fd4', '#1d1d26', '#d19a6b', '#0c0c0c'],
  boss:    ['#c9a227', '#3a2f10', '#e8b88a', '#888888']
};
function palFor(f) {
  if (f === S.player) return PAL.player;
  return PAL[f.type] || PAL.punk;
}

function drawFighter(f, isPlayer) {
  var pal = palFor(f);
  var sx = Math.round(f.x - S.scrollX + (S.shake > 0 ? (Math.random() - 0.5) * 6 : 0));
  var gy = Math.round(f.y);
  var z = f.z || 0;
  if (sx < -60 || sx > W + 60) return;
  var big = isPlayer ? 1 : (f.type === 'bruiser' ? 1.18 : (f.type === 'boss' ? 1.35 : 0.96));
  var u = 3.2 * big; // unit

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(sx, gy + 2, 9 * big, 3.5 * big, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(sx, gy - z);
  if (f.iframes > 0 && Math.floor(S.t * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.scale(f.facing, 1);

  var skin = pal[2], jacket = pal[0], pants = pal[1], hair = pal[3];
  var bob = (f.state === 'walk') ? Math.sin(f.walkPhase) * u * 0.35 : 0;
  var punchExt = 0, kickExt = 0, crouch = 0;

  if (f.state === 'punch') punchExt = Math.min(1, f.stateT / 0.07) * u * 3.2;
  if (f.state === 'fin') { punchExt = u * 2.2; kickExt = Math.min(1, f.stateT / 0.1) * u * 4.2; }
  if (f.state === 'kick' || f.state === 'jumpkick') kickExt = Math.min(1, f.stateT / 0.09) * u * 4.6;
  if (f.state === 'hit') crouch = u * 0.7;

  if (f.state === 'down' || f.state === 'dead') {
    // lying flat
    ctx.fillStyle = pants;
    ctx.fillRect(-u * 3.4, -u * 1.4, u * 6.8, u * 2.4);
    ctx.fillStyle = jacket;
    ctx.fillRect(u * 0.6, -u * 1.4, u * 3.2, u * 2.4);
    ctx.fillStyle = skin;
    ctx.fillRect(u * 3.4, -u * 1.2, u * 1.8, u * 2);
    ctx.restore();
    return;
  }

  var hipY = -u * 3.4 + bob * 0.3 - crouch;
  // legs
  ctx.fillStyle = pants;
  var legSwing = (f.state === 'walk') ? Math.sin(f.walkPhase) * u * 1.4 : 0;
  ctx.fillRect(-u * 1.5, hipY, u * 1.3, u * 3.4 + legSwing * 0.3);
  if (kickExt > 0) {
    ctx.fillRect(0, hipY + u * 0.4, u * 2.2 + kickExt, u * 1.2); // extended kick leg
  } else {
    ctx.fillRect(u * 0.4, hipY, u * 1.3, u * 3.4 - legSwing * 0.3);
  }
  // torso (jacket)
  ctx.fillStyle = jacket;
  ctx.fillRect(-u * 1.8, hipY - u * 3.2, u * 3.6, u * 3.4);
  // head
  ctx.fillStyle = skin;
  ctx.fillRect(-u * 1.1, hipY - u * 5.4, u * 2.2, u * 2.2);
  ctx.fillStyle = hair;
  ctx.fillRect(-u * 1.1, hipY - u * 5.9, u * 2.2, u * 0.9);
  // arms
  ctx.fillStyle = jacket;
  ctx.fillRect(-u * 2.6, hipY - u * 2.8, u * 1.1, u * 2.6); // back arm
  if (punchExt > 0) {
    ctx.fillStyle = skin;
    ctx.fillRect(0, hipY - u * 2.6, u * 2.4 + punchExt, u * 1.1); // punching arm
  } else {
    ctx.fillRect(u * 1.5, hipY - u * 2.8, u * 1.1, u * 2.6);
  }
  // weapon in hand
  if (f.weapon) {
    if (f.weapon.kind === 'bat') {
      ctx.fillStyle = '#8a5a2b';
      ctx.fillRect(u * 1.2, hipY - u * 6.4, u * 0.9, u * 4.6);
    } else {
      ctx.fillStyle = '#2fae5f';
      ctx.fillRect(u * 1.4, hipY - u * 4.6, u * 1.1, u * 2.2);
    }
  }
  ctx.restore();

  // enemy hp pips
  if (!isPlayer && f.hp < f.maxHp && f.state !== 'dead') {
    var wpx = 30 * big;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(sx - wpx / 2, gy - z - f.h * big - 12, wpx, 5);
    ctx.fillStyle = f.type === 'boss' ? '#c9a227' : '#ff5252';
    ctx.fillRect(sx - wpx / 2 + 1, gy - z - f.h * big - 11, (wpx - 2) * (f.hp / f.maxHp), 3);
  }
  // name tag for boss
  if (!isPlayer && f.type === 'boss' && f.state !== 'dead') {
    txt('BIG CHROME', sx, gy - z - f.h * big - 24, 8, '#c9a227', 'center');
  }
}

function drawWeaponPickup(wp) {
  var sx = Math.round(wp.x - S.scrollX);

  ctx.save();
  ctx.translate(sx, wp.y - 4 + Math.sin(S.t * 4) * 2);

  } else {
    ctx.fillStyle = '#2fae5f';

/* ---------------- background ---------------- */
function drawBackground() {
  var st = S.stages[S.stageIdx];
  // night sky (banded — no gradients, keeps every canvas shim safe)
  ctx.fillStyle = '#070714'; ctx.fillRect(0, 0, W, 80);
  ctx.fillStyle = '#101020'; ctx.fillRect(0, 80, W, 50);
  ctx.fillStyle = '#1a1a2c'; ctx.fillRect(0, 130, W, H - 130);

  // moon
  ctx.fillStyle = '#e8e4d0';
  ctx.beginPath(); ctx.arc(W - 52, 30, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#070714';
  ctx.beginPath(); ctx.arc(W - 46, 26, 12, 0, Math.PI * 2); ctx.fill();

  // far buildings (parallax 0.4)
  var off = S.scrollX * 0.4;
  ctx.fillStyle = '#0d0d1c';
  var seedBase = (S.stageIdx + 1) * 7919;
  for (var i = -1; i < 9; i++) {
    var bx = i * 64 - (off % 64);
    var bh = 60 + ((seedBase * (i + 20)) % 50);
    ctx.fillRect(bx, 96 - bh, 58, bh);
    // lit windows
    for (var wy = 96 - bh + 6; wy < 90; wy += 12) {
      for (var wx = bx + 6; wx < bx + 52; wx += 12) {
        if (((seedBase + wx * 7 + wy * 13) % 5) === 0) {
          ctx.fillStyle = '#ffd23f';
          ctx.fillRect(wx, wy, 6, 7);
          ctx.fillStyle = '#0d0d1c';
        }
      }
    }
  }

  // near buildings (parallax 0.75) — brick walls carrying posters + billboards
  var off2 = S.scrollX * 0.75;
  for (var j = -1; j < 7; j++) {
    var nx = j * 96 - (off2 % 96);
    ctx.fillStyle = '#191926';
    ctx.fillRect(nx, 40, 92, 92);
    ctx.fillStyle = '#22222f';
    for (var by = 46; by < 128; by += 10) ctx.fillRect(nx, by, 92, 1);
    // CWI wall poster (original, drawn in code)
    if (((seedBase + j * 31) % 3) === 0) {
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(nx + 12, 58, 30, 40);
      ctx.fillStyle = '#17c3b2';
      ctx.fillRect(nx + 14, 60, 26, 36);
      txt('CWI', nx + 27, 70, 8, '#0a0a12', 'center');
      txt('KINGS', nx + 27, 80, 6, '#0a0a12', 'center');
    }
  }

  // billboards with catalog cover art
  for (var b = 0; b < st.billboards.length; b++) {
    var bb = st.billboards[b];
    var sx = Math.round(bb.x - S.scrollX);
    if (sx + bb.w < -10 || sx > W + 10) continue;
    // support pole
    ctx.fillStyle = '#33333f';
    ctx.fillRect(sx + bb.w / 2 - 3, bb.y + bb.h, 6, 132 - (bb.y + bb.h));
    // frame
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(sx - 4, bb.y - 4, bb.w + 8, bb.h + 8);
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(sx - 4, bb.y - 4, bb.w + 8, 3);
    var im = ART[bb.art];
    if (im && im.complete && im.naturalWidth) {
      try { ctx.drawImage(im, sx, bb.y, bb.w, bb.h); } catch (e) {
        ctx.fillStyle = '#22222f'; ctx.fillRect(sx, bb.y, bb.w, bb.h);
      }
    } else {
      ctx.fillStyle = '#22222f';
      ctx.fillRect(sx, bb.y, bb.w, bb.h);
      txt(bb.art.toUpperCase(), sx + bb.w / 2, bb.y + bb.h / 2 - 5, 8, '#17c3b2', 'center');
    }
    txt('CWI RECORDS', sx + bb.w / 2, bb.y + bb.h + 8, 7, '#c9a227', 'center');
  }

  // street
  ctx.fillStyle = '#101018';
  ctx.fillRect(0, SK.Y_MIN - 14, W, H - SK.Y_MIN + 14);
  ctx.fillStyle = '#181822';
  ctx.fillRect(0, SK.Y_MIN - 14, W, 4);
  // lane dashes scroll with world
  ctx.fillStyle = '#2c2c3a';
  var laneOff = S.scrollX % 48;
  for (var lx = -laneOff; lx < W; lx += 48) ctx.fillRect(lx, 162, 24, 3);
  // streetlights
  for (var sli = 0; sli < 3; sli++) {
    var lx2 = sli * 170 - (S.scrollX % 170);
    ctx.fillStyle = '#2c2c3a';
    ctx.fillRect(lx2, 84, 4, 60);
    ctx.fillStyle = 'rgba(255,210,63,0.16)';
    ctx.beginPath(); ctx.ellipse(lx2 + 2, 150, 34, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(lx2 - 3, 80, 10, 5);
  }
  // arena barrier when locked
  if (S.arena) {
    ctx.fillStyle = 'rgba(201,162,39,0.85)';
    ctx.fillRect(W - 8, 60, 8, 140);
    ctx.fillRect(0, 60, 8, 140);
    txt('LOCKED', W / 2, 66, 9, '#c9a227', 'center');
  }
}

function drawEnd(win) {
  drawBackground();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  txt(win ? 'BLOCK RECLAIMED!' : 'GAME OVER', W / 2, 70, 22, win ? '#ffd23f' : '#ff5252', 'center');
  txt('SCORE ' + S.score, W / 2, 110, 12, '#fff', 'center');
  if (win) {
    txt('The Kings own the neon streets again.', W / 2, 132, 8, '#17c3b2', 'center');
    txt('Every billboard still standing.', W / 2, 143, 8, '#17c3b2', 'center');
  } else {
    txt('The Vipers hold the block... for now.', W / 2, 132, 8, '#888', 'center');
  }
  if (Math.floor(S.t * 2) % 2 === 0) txt('TAP OR PRESS ENTER', W / 2, 170, 11, '#fff', 'center');
}

function render() {
  ctx.save();
  if (S.screen === 'title') { drawTitle(); }
  else if (S.screen === 'gameover') { drawEnd(false); }
  else if (S.screen === 'victory') { drawEnd(true); }
  else {
    drawBackground();
    // depth sort: weapons, fighters by y
    var draws = [];
    for (var i = 0; i < S.weapons.length; i++) draws.push({ y: S.weapons[i].y, k: 'w', o: S.weapons[i] });
    draws.push({ y: S.player.y, k: 'p', o: S.player });
    for (var j = 0; j < S.enemies.length; j++) draws.push({ y: S.enemies[j].y, k: 'e', o: S.enemies[j] });
    draws.sort(function (a, b) { return a.y - b.y; });
    for (var d = 0; d < draws.length; d++) {
      var it = draws[d];
      if (it.k === 'w') drawWeaponPickup(it.o);
      else if (it.k === 'p') drawFighter(it.o, true);
      else drawFighter(it.o, false);
    }
    // particles
    for (var q = 0; q < S.particles.length; q++) {
      var pt = S.particles[q];
      var a = 1 - pt.t / pt.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      var psx = Math.round(pt.x - S.scrollX);
      ctx.fillRect(psx - pt.size / 2, pt.y - pt.z - pt.size / 2, pt.size, pt.size);
      ctx.globalAlpha = 1;
    }
    drawHUD();
    if (S.paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      txt('PAUSED', W / 2, 96, 20, '#ffd23f', 'center');
      txt('P / TAP ⏸ TO RESUME', W / 2, 126, 9, '#fff', 'center');
    }
  }
  ctx.restore();
}
